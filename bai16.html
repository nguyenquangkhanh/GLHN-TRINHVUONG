<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trắc nghiệm - Bài 16: Hôn Nhân Trọn Vẹn & Hòa Hợp Vợ Chồng</title>
<style>
  :root{
    --bg:#f5f1e8;
    --card:#ffffff;
    --accent:#7a3b2e;
    --accent2:#b5834f;
    --ok:#3a7d44;
    --bad:#b3372c;
    --text:#2c231b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia', 'Segoe UI', serif;
    background:linear-gradient(180deg,#f5f1e8,#ece3d2);
    color:var(--text);
    padding:24px 12px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    color:var(--accent);
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:#7a6a55;
    font-size:0.95rem;
  }
  #progress-wrap{
    background:#e2d8c3;
    border-radius:20px;
    height:10px;
    overflow:hidden;
    margin:16px 0 24px;
  }
  #progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .3s ease;
  }
  .question-card{
    background:var(--card);
    border-radius:14px;
    padding:22px 24px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    margin-bottom:18px;
    border-left:5px solid var(--accent2);
  }
  .q-number{
    font-size:0.8rem;
    color:var(--accent2);
    font-weight:bold;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .q-text{
    font-size:21pt;
    margin-bottom:14px;
    line-height:1.5;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 14px;
    border:1.5px solid #e0d5c0;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s, border-color .15s;
    font-size:21pt;
    line-height:1.4;
  }
  .option:hover{background:#f8f2e6;}
  .option.selected{
    border-color:var(--accent);
    background:#f1e6d8;
  }
  .option.correct{
    border-color:var(--ok);
    background:#e4f3e6;
  }
  .option.incorrect{
    border-color:var(--bad);
    background:#f8e3e0;
  }
  .option input{margin-top:3px;}
  .letter{
    font-weight:bold;
    color:var(--accent2);
    min-width:18px;
  }
  #nav-btn, #retry-btn{
    display:block;
    width:100%;
    padding:14px;
    font-size:18pt;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    margin-top:10px;
    transition:background .2s;
  }
  #nav-btn:hover, #retry-btn:hover{background:#5f2e24;}
  #result{
    text-align:center;
    background:var(--card);
    border-radius:14px;
    padding:28px 20px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    display:none;
  }
  #result h2{color:var(--accent);margin-top:0;}
  #score-num{
    font-size:2.6rem;
    font-weight:bold;
    color:var(--accent);
  }
  .feedback{
    margin-top:10px;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
    font-size:17pt;
  }
  .feedback-correct{
    color:var(--ok);
    background:#e4f3e6;
  }
  .feedback-incorrect{
    color:var(--bad);
    background:#f8e3e0;
  }
  .unanswered-note{
    color:var(--bad);
    font-size:0.9rem;
    text-align:center;
    margin:4px 0 14px;
    display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bài 16: Hôn Nhân Công Giáo Trọn Vẹn - Một Vợ Một Chồng & Hòa Hợp Vợ Chồng</h1>
    <p>Trắc nghiệm 25 câu — hãy chọn đáp án đúng nhất</p>
  </header>

  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <p id="progress-text" style="text-align:center;color:#7a6a55;font-size:0.9rem;margin:-16px 0 20px;"></p>

  <div id="quiz-container"></div>

  <div id="result">
    <h2>Kết quả</h2>
    <div id="score-num"></div>
    <p id="score-text"></p>
    <button id="retry-btn">Làm lại</button>
  </div>
</div>

<script>
const questions = [
{q:"Người tín hữu cần có \"người thứ ba\" nào để hôn nhân được trọn vẹn?", options:["Cha mẹ hai bên","Chính Đức Ki-tô","Cha xứ","Cộng đoàn giáo xứ"], answer:1},
{q:"Hôn nhân công giáo trọn vẹn cần hội đủ mấy yếu tố?", options:["Hai yếu tố","Ba yếu tố","Bốn yếu tố","Năm yếu tố"], answer:1},
{q:"Ba yếu tố làm nên hôn nhân công giáo trọn vẹn là gì?", options:["Đã thành sự - Là bí tích - Đã hoàn hợp","Đã đăng ký - Có phép chuẩn - Có nhân chứng","Đã rửa tội - Có của hồi môn - Có nhà cửa","Đã thành sự - Có con cái - Sống chung"], answer:0},
{q:"\"Đã thành sự\" trong hôn nhân công giáo nghĩa là gì?", options:["Được cử hành công khai có người chứng","Được cha mẹ đồng ý","Đã đăng ký kết hôn dân sự","Đã sống chung nhiều năm"], answer:0},
{q:"\"Là bí tích\" trong hôn nhân công giáo nghĩa là gì?", options:["Có nghi thức tôn giáo trang trọng","Giữa hai người đã được rửa tội","Có sự chứng giám của giám mục","Được tổ chức tại nhà thờ"], answer:1},
{q:"\"Đã hoàn hợp\" trong hôn nhân công giáo nghĩa là gì?", options:["Vợ chồng đã ăn ở với nhau","Vợ chồng đã có con","Vợ chồng đã sống chung nhà","Vợ chồng đã làm lễ cưới"], answer:0},
{q:"Trường hợp nào sau đây là hôn nhân công giáo CHƯA trọn vẹn?", options:["Hôn nhân đã thành sự nhưng chưa ăn ở với nhau","Hôn nhân giữa hai người đã rửa tội và đã ăn ở với nhau","Hôn nhân được cử hành công khai và đôi bạn đã sống chung","Hôn nhân giữa hai người Công giáo có đầy đủ ba yếu tố"], answer:0},
{q:"\"Đặc ân thánh Phaolô\" (1Cr 7,15) áp dụng cho trường hợp nào?", options:["Hai người Công giáo ly thân","Hai người chưa rửa tội đã kết hôn, sau đó một người trở lại đạo và người kia không muốn chung sống","Hôn nhân bị Hội Thánh tuyên bố vô hiệu","Vợ chồng không có con cái"], answer:1},
{q:"Theo đặc ân thánh Phaolô, hôn nhân chỉ được tháo gỡ khi nào?", options:["Khi cả hai đồng ý ly hôn","Khi người mới theo đạo lấy một người khác","Khi có phép chuẩn của Giám mục","Khi hai người sống xa nhau quá 5 năm"], answer:1},
{q:"Hội Thánh có quyền công bố hôn nhân vô hiệu khi nào?", options:["Khi vợ chồng cãi nhau nhiều lần","Khi hôn nhân đã không thành sự ngay từ đầu do mắc ngăn trở","Khi một trong hai người muốn ly hôn","Khi hai vợ chồng không có con"], answer:1},
{q:"Nền tảng của sự trọn vẹn trong hôn nhân công giáo được Thiên Chúa thiết lập từ đâu?", options:["Từ việc tạo dựng trời đất","Từ việc rút xương sườn người nam để tạo ra người nữ","Từ Mười Điều Răn","Từ giao ước với ông Áp-ra-ham"], answer:1},
{q:"Vì con người là hình ảnh Thiên Chúa nên con người cần được:", options:["Sử dụng như một công cụ","Tôn trọng và yêu thương","Kiểm soát chặt chẽ","Đối xử theo pháp luật"], answer:1},
{q:"Hành vi tính dục trong hôn nhân được ví như:", options:["Một nghĩa vụ bắt buộc","Giường hôn nhân là bàn thờ của đôi bạn","Một thói quen sinh học","Một hình thức giải trí"], answer:1},
{q:"Trong hôn nhân, đôi bạn tự hiến cho nhau chứ không phải:", options:["Chiều theo thú tính","Chiều theo ý cha mẹ","Chiều theo phong tục","Chiều theo dư luận xã hội"], answer:0},
{q:"\"Đơn nhất\" trong hôn nhân công giáo nghĩa là gì?", options:["Một vợ một chồng","Sống độc thân","Không có con cái","Không ràng buộc pháp lý"], answer:0},
{q:"Theo Mt 19,6 và St 2,24, vợ chồng được ví như thế nào?", options:["Hai người bạn đồng hành","Không còn là hai, nhưng là một xương một thịt","Hai cá thể độc lập","Hai đối tác kinh doanh"], answer:1},
{q:"Sự hiệp thông vợ chồng được củng cố và hoàn thiện nhờ điều gì?", options:["Của cải vật chất","Bí tích Hôn Phối đem lại sự hiệp thông trong Đức Kitô","Sự đồng thuận của họ hàng hai bên","Thời gian chung sống lâu dài"], answer:1},
{q:"Đa thê (nhiều vợ nhiều chồng) đi ngược lại với điều gì?", options:["Phong tục truyền thống","Tình yêu vợ chồng và sự bình đẳng giữa hai vợ chồng","Quy định của pháp luật dân sự","Ý muốn của cha mẹ hai bên"], answer:1},
{q:"Đâu KHÔNG phải là nguyên nhân gây xung đột vợ chồng theo bài học?", options:["Sự khác biệt về tâm sinh lý giữa nam và nữ","Sự khác biệt về cá tính mỗi người","Việc hai vợ chồng cùng đi lễ nhà thờ","Bất đồng trong việc quản lý chi tiêu"], answer:2},
{q:"Xung đột vợ chồng nếu không được giải quyết có thể dẫn đến hậu quả gì về mặt gia đình?", options:["Con cái học giỏi hơn","Ly thân, ly dị, gia đình tan vỡ","Kinh tế gia đình phát triển","Họ hàng hai bên gắn kết hơn"], answer:1},
{q:"Biện pháp ngăn ngừa xung đột trước khi kết hôn là gì?", options:["Tìm hiểu nhau kỹ lưỡng, tránh ảo tưởng về nhau","Tổ chức đám cưới thật lớn","Chuẩn bị thật nhiều của hồi môn","Mời càng nhiều khách càng tốt"], answer:0},
{q:"Khi xảy ra xung đột, thái độ đầu tiên cần có là gì?", options:["Im lặng bỏ đi","Tự chủ - kìm hãm tính nóng nảy và tự ái","Tìm người bênh vực mình","Đòi ly hôn ngay lập tức"], answer:1},
{q:"Khi tranh cãi, mục đích của vợ chồng là gì?", options:["Tìm ra điều tốt hơn để đi đến chỗ hợp nhất","Ăn thua nhau để chứng minh mình đúng","Hạ nhục đối phương","Tránh né không nói chuyện"], answer:0},
{q:"Trong đối thoại giải quyết xung đột, cần tránh điều gì?", options:["Lắng nghe ý kiến của người kia","Nhắc lại chuyện cũ, \"bới lông tìm vết\"","Giới hạn vấn đề đang tranh cãi","Trình bày quan điểm của mình"], answer:1},
{q:"Theo bài học, phương cách nào giúp vợ chồng có sự bình tĩnh và nhận ra ý Chúa khi giải quyết xung đột?", options:["Nhờ trung gian hòa giải","Cầu nguyện chung với nhau","Chấp nhận khuyết điểm của mình","Hàn gắn làm lành ngay"], answer:1},
];

const letters = ["A","B","C","D"];
const container = document.getElementById('quiz-container');
const answers = new Array(questions.length).fill(null);
let current = 0;

function renderQuestion(qi){
  container.innerHTML = '';
  const item = questions[qi];
  const card = document.createElement('div');
  card.className = 'question-card';
  card.innerHTML = `<div class="q-number">Câu ${qi+1} / ${questions.length}</div>
    <div class="q-text">${item.q}</div>
    <div class="options" id="opts-${qi}"></div>
    <div class="feedback" id="feedback-${qi}" style="display:none;"></div>`;
  container.appendChild(card);
  const optsDiv = card.querySelector(`#opts-${qi}`);
  item.options.forEach((opt, oi) => {
    const label = document.createElement('label');
    label.className = 'option';
    label.id = `opt-${qi}-${oi}`;
    label.innerHTML = `<span class="letter">${letters[oi]}.</span><span>${opt}</span>`;
    label.addEventListener('click', () => selectOption(qi, oi));
    optsDiv.appendChild(label);
  });

  const navBtn = document.createElement('button');
  navBtn.id = 'nav-btn';
  navBtn.textContent = qi === questions.length - 1 ? 'Nộp bài' : 'Câu tiếp theo →';
  navBtn.style.display = 'none';
  navBtn.addEventListener('click', () => {
    if(qi === questions.length - 1){
      showResult();
    } else {
      current = qi + 1;
      renderQuestion(current);
    }
  });
  container.appendChild(navBtn);

  updateProgress();
}

function selectOption(qi, oi){
  if(answers[qi] !== null) return; // đã chọn và khóa câu này rồi
  answers[qi] = oi;
  const item = questions[qi];
  for(let i=0;i<4;i++){
    const el = document.getElementById(`opt-${qi}-${i}`);
    if(i === item.answer){
      el.classList.add('correct');
    } else if(i === oi){
      el.classList.add('incorrect');
    }
  }
  const feedback = document.getElementById(`feedback-${qi}`);
  if(oi === item.answer){
    feedback.textContent = '✔ Chính xác!';
    feedback.className = 'feedback feedback-correct';
  } else {
    feedback.textContent = '✘ Chưa đúng. Đáp án đúng là ' + letters[item.answer] + '.';
    feedback.className = 'feedback feedback-incorrect';
  }
  feedback.style.display = 'block';
  document.getElementById('nav-btn').style.display = 'block';
  updateProgress();
}

function updateProgress(){
  const answered = answers.filter(a => a !== null).length;
  const pct = Math.round((answered/questions.length)*100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `Đã trả lời ${answered}/${questions.length} câu`;
}

function showResult(){
  container.innerHTML = '';
  let score = 0;
  questions.forEach((item, qi) => { if(answers[qi] === item.answer) score++; });
  document.getElementById('result').style.display = 'block';
  document.getElementById('score-num').textContent = score + ' / ' + questions.length;
  const pct = Math.round((score/questions.length)*100);
  let msg = '';
  if(pct === 100) msg = 'Xuất sắc! Bạn đã nắm vững toàn bộ bài học. 🎉';
  else if(pct >= 80) msg = 'Rất tốt! Bạn hiểu bài khá vững.';
  else if(pct >= 60) msg = 'Khá ổn, nhưng nên xem lại một số điểm.';
  else msg = 'Hãy ôn lại bài học và thử lại nhé.';
  document.getElementById('score-text').textContent = msg + ' (' + pct + '%)';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

document.getElementById('retry-btn').addEventListener('click', () => {
  answers.fill(null);
  current = 0;
  document.getElementById('result').style.display = 'none';
  renderQuestion(current);
  window.scrollTo({top:0, behavior:'smooth'});
});

renderQuestion(current);

</script>
</body>
</html>

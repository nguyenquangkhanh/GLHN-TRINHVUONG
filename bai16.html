<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trắc nghiệm - Bài 16: Hôn Nhân Trọn Vẹn & Hòa Hợp Vợ Chồng</title>
<style>
  :root{
    --bg:#f5f1e8;
    --card:#ffffff;
    --accent:#7a3b2e;
    --accent2:#b5834f;
    --ok:#3a7d44;
    --bad:#b3372c;
    --text:#2c231b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia', 'Segoe UI', serif;
    background:linear-gradient(180deg,#f5f1e8,#ece3d2);
    color:var(--text);
    padding:24px 12px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    color:var(--accent);
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:#7a6a55;
    font-size:0.95rem;
  }
  #progress-wrap{
    background:#e2d8c3;
    border-radius:20px;
    height:10px;
    overflow:hidden;
    margin:16px 0 24px;
  }
  #progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    transition:width .3s ease;
  }
  .question-card{
    background:var(--card);
    border-radius:14px;
    padding:22px 24px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    margin-bottom:18px;
    border-left:5px solid var(--accent2);
  }
  .q-number{
    font-size:0.8rem;
    color:var(--accent2);
    font-weight:bold;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .q-text{
    font-size:21pt;
    margin-bottom:14px;
    line-height:1.5;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 14px;
    border:1.5px solid #e0d5c0;
    border-radius:9px;
    cursor:pointer;
    transition:background .15s, border-color .15s;
    font-size:21pt;
    line-height:1.4;
  }
  .option:hover{background:#f8f2e6;}
  .option.selected{
    border-color:var(--accent);
    background:#f1e6d8;
  }
  .option.correct{
    border-color:var(--ok);
    background:#e4f3e6;
  }
  .option.incorrect{
    border-color:var(--bad);
    background:#f8e3e0;
  }
  .option input{margin-top:3px;}
  .letter{
    font-weight:bold;
    color:var(--accent2);
    min-width:18px;
  }
  #nav-btn, #retry-btn{
    display:block;
    width:100%;
    padding:14px;
    font-size:18pt;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    margin-top:10px;
    transition:background .2s;
  }
  #nav-btn:hover, #retry-btn:hover{background:#5f2e24;}
  #result{
    text-align:center;
    background:var(--card);
    border-radius:14px;
    padding:28px 20px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    display:none;
  }
  #result h2{color:var(--accent);margin-top:0;}
  #score-num{
    font-size:2.6rem;
    font-weight:bold;
    color:var(--accent);
  }
  .feedback{
    margin-top:10px;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
    font-size:17pt;
  }
  .feedback-correct{
    color:var(--ok);
    background:#e4f3e6;
  }
  .feedback-incorrect{
    color:var(--bad);
    background:#f8e3e0;
  }
  .unanswered-note{
    color:var(--bad);
    font-size:0.9rem;
    text-align:center;
    margin:4px 0 14px;
    display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Bài 16: Hôn Nhân Công Giáo Trọn Vẹn - Một Vợ Một Chồng & Hòa Hợp Vợ Chồng</h1>
    <p>Trắc nghiệm 30 câu — hãy chọn đáp án đúng nhất</p>
  </header>

  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <p id="progress-text" style="text-align:center;color:#7a6a55;font-size:0.9rem;margin:-16px 0 20px;"></p>

  <div id="quiz-container"></div>

  <div id="result">
    <h2>Kết quả</h2>
    <div id="score-num"></div>
    <p id="score-text"></p>
    <button id="retry-btn">Làm lại</button>
  </div>
</div>

<script>
const questions = [
{q:"Đức mến (theo 1 Cr 13,4-7) KHÔNG có đặc tính nào sau đây?", options:["Ghen tương","Nhẫn nhục","Hiền hậu","Tha thứ tất cả"], answer:0},
{q:"Hôn nhân Công giáo được gọi là \"trọn vẹn\" khi hội đủ bao nhiêu yếu tố?", options:["2","3","4","5"], answer:1},
{q:"Yếu tố \"ĐÃ THÀNH SỰ\" trong hôn nhân Công giáo được hiểu là gì?", options:["Vợ chồng đã ăn ở với nhau","Cả hai đã được rửa tội","Cử hành công khai có người chứng","Được Hội Thánh công bố vô hiệu"], answer:2},
{q:"Yếu tố \"LÀ BÍ TÍCH\" trong hôn nhân Công giáo đòi hỏi điều kiện nào?", options:["Cử hành công khai","Vợ chồng đã ăn ở với nhau","Đã được Hội Thánh chuẩn nhận","Cả hai người đã được rửa tội"], answer:3},
{q:"\"Đã hoàn hợp\" trong hôn nhân Công giáo nghĩa là gì?", options:["Vợ chồng đã ăn ở với nhau","Đã kết hôn hợp pháp trước pháp luật","Đã được Hội Thánh chuẩn nhận","Đã sống chung nhiều năm"], answer:0},
{q:"Trường hợp nào sau đây KHÔNG thuộc diện hôn nhân \"chưa trọn vẹn\"?", options:["Hôn nhân đã thành sự nhưng chưa ăn ở với nhau","Hôn nhân đã thành sự, là bí tích và đã hoàn hợp","Hôn nhân theo đặc ân thánh Phaolô","Hôn nhân không thành sự do vướng ngăn trở"], answer:1},
{q:"\"Đặc ân thánh Phaolô\" áp dụng cho trường hợp nào?", options:["Hai người Công giáo ly thân","Hôn nhân bị Hội Thánh tuyên bố vô hiệu","Hai người chưa rửa tội, sau đó một người trở lại đạo và người kia không muốn chung sống","Hôn nhân giữa người Công giáo và người ngoại đạo"], answer:2},
{q:"\"Đặc ân thánh Phaolô\" được trích dẫn từ đoạn Kinh Thánh nào?", options:["Mt 19,6","St 2,24","1Cr 13,4-7","1Cr 7,12-15"], answer:3},
{q:"Nền tảng của sự trọn vẹn trong hôn nhân Công giáo bắt nguồn từ đâu?", options:["Việc Thiên Chúa dựng nên người nữ từ xương sườn người nam","Luật pháp dân sự","Phong tục tập quán của xã hội","Sự thỏa thuận giữa hai gia đình"], answer:0},
{q:"Vì con người là hình ảnh Thiên Chúa, con người cần được đối xử thế nào?", options:["Sử dụng như đồ vật","Tôn trọng và yêu thương","Kiểm soát và áp đặt","Xem như tài sản riêng"], answer:1},
{q:"Câu nói \"Giường hôn nhân là bàn thờ của đôi bạn\" muốn diễn tả điều gì?", options:["Vợ chồng chiều theo bảng năng giới tính","Hôn nhân là một nghi lễ tôn giáo quan trọng","Đôi bạn tự hiến cho nhau cách thánh thiêng, không phải chiều theo bản năng","Vợ chồng phải sống khắc khổ"], answer:2},
{q:"\"Đơn nhất\" trong hôn nhân Công giáo có nghĩa là gì?", options:["Vợ chồng sống độc lập với nhau","Kết hôn mà bị vô sinh - không có con cái","Chỉ kết hôn một lần duy nhất","Một vợ một chồng"], answer:3},
{q:"Theo Mt 19,6, sau khi kết hôn vợ chồng được ví như điều gì?", options:["Một xương một thịt","Hai người xa lạ","Hai thực thể độc lập","Bạn đồng hành"], answer:0},
{q:"Đâu KHÔNG phải là nguyên nhân gây xung đột vợ chồng theo bài học?", options:["Khác biệt về tâm sinh lý nam nữ","Cùng chung một đức tin","Khác biệt về cá tính","Bất đồng trong quản lý chi tiêu"], answer:1},
{q:"Sự khác biệt về \"bậc thang giá trị\" được minh hoạ bằng ví dụ nào trong bài?", options:["Người nhanh nhẹn, người chậm chạp","Người tiết kiệm, người hoang phí","Người coi trọng tình nghĩa, người đặt nặng vật chất","Người nghiêm khắc, người chiều chuộng"], answer:2},
{q:"Hậu quả xung đột về mặt đạo đức được nêu trong bài là gì?", options:["Gia đình tan vỡ","Vợ chồng lạnh nhạt","Con cái bị bỏ bê","Dễ rơi vào tệ nạn xã hội, ngoại tình"], answer:3},
{q:"Biện pháp ngăn ngừa xung đột trước khi kết hôn được bài học đề nghị là gì?", options:["Tìm hiểu nhau kỹ lưỡng, tránh ảo tưởng về nhau","Sống thử trước hôn nhân","Nhờ cha mẹ quyết định thay","Kết hôn càng sớm càng tốt"], answer:0},
{q:"Thái độ \"tự chủ\" khi xảy ra xung đột được hiểu là gì?", options:["Im lặng tuyệt đối, không nói gì","Kìm hãm tính nóng nảy và tự ái, tránh phản ứng vội vàng","Rời khỏi nhà để tránh mặt","Nhờ người khác giải quyết thay"], answer:1},
{q:"Theo bài học, mục đích của việc vợ chồng đối thoại - giải quyết xung đột nên là gì?", options:["Chứng minh ai đúng ai sai","Hạ nhục đối phương","Tìm ra điều tốt hơn để đi đến chỗ hợp nhất","Giành phần thắng trong tranh luận"], answer:2},
{q:"Trong phương cách \"đối thoại\", điều cần tránh là gì?", options:["Lắng nghe ý kiến của người kia","Trình bày quan điểm của mình","Giới hạn vấn đề đang bàn","Bới lông tìm vết, nhắc lại chuyện cũ"], answer:3},
{q:"Trong phần \"4 Ghi nhớ\", nguyên tắc nào được nhắc đến CUỐI CÙNG?", options:["Cầu nguyện","Tự chủ","Đối thoại","Chấp nhận khuyết điểm"], answer:0},
{q:"Theo phần Ghi nhớ, có tất cả bao nhiêu nguyên tắc giúp vợ chồng giải quyết xung đột?", options:["Năm","Bảy","Sáu","Tám"], answer:1},
{q:"Người được chọn làm \"trung gian hoà giải\" cần có đặc điểm gì?", options:["Là người thân trong gia đình","Là người lớn tuổi nhất trong họ","Có uy tín, biết phân xử hợp tình hợp lý, hiểu cả hai bên","Là linh mục quản xứ"], answer:2},
{q:"Việc cầu nguyện chung giúp vợ chồng điều gì khi đang tranh cãi?", options:["Quên đi vấn đề đang tranh cãi","Tránh né việc giải quyết mâu thuẫn","Không cần đối thoại nữa","Có sự bình tĩnh để thảo luận ôn hoà, nhận ra ý Chúa"], answer:3},
{q:"Đôi bạn được mời gọi sống lời cam kết hôn nhân mỗi ngày bằng cách nào?", options:["Trao hiến trọn vẹn cho nhau","Giữ khoảng cách để tôn trọng tự do cá nhân","Sống theo cảm xúc nhất thời","Tuân theo ý muốn của gia đình hai bên"], answer:0},
{q:"Điều gì giúp củng cố, thanh luyện và hoàn thiện sự hiệp thông vợ chồng theo bài học?", options:["Việc chia sẻ tài chính chung","Bí tích Hôn phối đem lại sự hiệp thông trong Đức Kitô","Việc sống chung nhiều năm","Sự đồng thuận của gia đình hai bên"], answer:1},
{q:"\"Đa thê\" bị xem là đi ngược lại điều gì?", options:["Phong tục truyền thống","Luật pháp dân sự hiện hành","Tình yêu vợ chồng và sự bình đẳng giữa hai vợ chồng","Quy định của giáo xứ"], answer:2},
{q:"Điều gì quan trọng nhất khi muốn giải quyết xung đột?", options:["Biết rõ điểm đúng sai, phải trái của từng người","Nhận thức được vấn đề ưu khuyết điểm","Người trung gian giúp đỡ","Có thiện chí muốn giải quyết"], answer:3},
{q:"Nếu biết cách giải quyết những bất hoà, điều đó sẽ đem lại kết quả gì theo bài học?", options:["Giúp hai vợ chồng hiểu nhau hơn và tình yêu thêm triển nở","Gia đình chắc chắn không còn xung đột nữa","Con cái sẽ ngoan ngoãn hơn","Vợ chồng sẽ giàu có hơn"], answer:0},
{q:"Câu \"Đức mến tha thứ tất cả, tin tưởng tất cả, chịu đựng tất cả\" được trích từ đâu?", options:["Mt 19,6","1Cr 13,4-7","St 2,24","1Cr 7,15"], answer:1},
];

const letters = ["A","B","C","D"];
const container = document.getElementById('quiz-container');
const answers = new Array(questions.length).fill(null);
let current = 0;

function renderQuestion(qi){
  container.innerHTML = '';
  const item = questions[qi];
  const card = document.createElement('div');
  card.className = 'question-card';
  card.innerHTML = `<div class="q-number">Câu ${qi+1} / ${questions.length}</div>
    <div class="q-text">${item.q}</div>
    <div class="options" id="opts-${qi}"></div>
    <div class="feedback" id="feedback-${qi}" style="display:none;"></div>`;
  container.appendChild(card);
  const optsDiv = card.querySelector(`#opts-${qi}`);
  item.options.forEach((opt, oi) => {
    const label = document.createElement('label');
    label.className = 'option';
    label.id = `opt-${qi}-${oi}`;
    label.innerHTML = `<span class="letter">${letters[oi]}.</span><span>${opt}</span>`;
    label.addEventListener('click', () => selectOption(qi, oi));
    optsDiv.appendChild(label);
  });

  const navBtn = document.createElement('button');
  navBtn.id = 'nav-btn';
  navBtn.textContent = qi === questions.length - 1 ? 'Nộp bài' : 'Câu tiếp theo →';
  navBtn.style.display = 'none';
  navBtn.addEventListener('click', () => {
    if(qi === questions.length - 1){
      showResult();
    } else {
      current = qi + 1;
      renderQuestion(current);
    }
  });
  container.appendChild(navBtn);

  updateProgress();
}

function selectOption(qi, oi){
  if(answers[qi] !== null) return; // đã chọn và khóa câu này rồi
  answers[qi] = oi;
  const item = questions[qi];
  for(let i=0;i<4;i++){
    const el = document.getElementById(`opt-${qi}-${i}`);
    if(i === item.answer){
      el.classList.add('correct');
    } else if(i === oi){
      el.classList.add('incorrect');
    }
  }
  const feedback = document.getElementById(`feedback-${qi}`);
  if(oi === item.answer){
    feedback.textContent = '✔ Chính xác!';
    feedback.className = 'feedback feedback-correct';
  } else {
    feedback.textContent = '✘ Chưa đúng. Đáp án đúng là ' + letters[item.answer] + '.';
    feedback.className = 'feedback feedback-incorrect';
  }
  feedback.style.display = 'block';
  document.getElementById('nav-btn').style.display = 'block';
  updateProgress();
}

function updateProgress(){
  const answered = answers.filter(a => a !== null).length;
  const pct = Math.round((answered/questions.length)*100);
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `Đã trả lời ${answered}/${questions.length} câu`;
}

function showResult(){
  container.innerHTML = '';
  let score = 0;
  questions.forEach((item, qi) => { if(answers[qi] === item.answer) score++; });
  document.getElementById('result').style.display = 'block';
  document.getElementById('score-num').textContent = score + ' / ' + questions.length;
  const pct = Math.round((score/questions.length)*100);
  let msg = '';
  if(pct === 100) msg = 'Xuất sắc! Bạn đã nắm vững toàn bộ bài học. 🎉';
  else if(pct >= 80) msg = 'Rất tốt! Bạn hiểu bài khá vững.';
  else if(pct >= 60) msg = 'Khá ổn, nhưng nên xem lại một số điểm.';
  else msg = 'Hãy ôn lại bài học và thử lại nhé.';
  document.getElementById('score-text').textContent = msg + ' (' + pct + '%)';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

document.getElementById('retry-btn').addEventListener('click', () => {
  answers.fill(null);
  current = 0;
  document.getElementById('result').style.display = 'none';
  renderQuestion(current);
  window.scrollTo({top:0, behavior:'smooth'});
});

renderQuestion(current);

</script>
</body>
</html>

    // --- THAY ĐỔI URL DƯỚI ĐÂY THÀNH URL APPS SCRIPT CỦA BẠN ---

    // Dữ liệu Đề thi
    const p1 = [
        {id:"p1q1", q:"Câu 1: Hôn nhân là gì ?", o:{A:"A. Hôn nhân là một giao ước giữa một người nam và một người nữ, có mục đích yêu thương nâng đỡ nhau trong tình vợ chồng, sinh sản và giáo dục con cái.", B:"B. Hôn nhân là một giao ước giữa hai người, có mục đích yêu thương nâng đỡ nhau trong tình vợ chồng, sinh sản và giáo dục con cái.", C:"C. Hôn nhân là một giao ước giữa một người nam và một người nữ, có mục đích yêu thương nâng đỡ nhau trong tình vợ chồng.", D:"D. Cả A, B và C"}},
        {id:"p1q2", q:"Câu 2: Hôn nhân Công giáo là gì ?", o:{A:"A. Hôn nhân Công giáo là Hôn nhân giữa hai người cùng theo Đạo Công giáo.", B:"B. Hôn nhân Công giáo là Hôn nhân được Chúa Giê-su nâng lên hàng Bí tích.", C:"C. Hôn nhân Công giáo là Hôn nhân giữa hai người cùng theo Đạo Công giáo, hoặc giữa một người theo Đạo Công Giáo và một người không theo.", D:"D. Cả A, B và C"}},
        {id:"p1q3", q:"Câu 3: Tình yêu giữa Chúa Ki-tô và Hội Thánh có những đặc điểm nào ?", o:{A:"A. Tình yêu giữa Chúa Ki-tô và Hội Thánh là sự kết hợp phong phú giữa Chúa Ki-tô và Hội Thánh.", B:"B. Tình yêu giữa Chúa Ki-tô và Hội Thánh là sự hiến thân trọn vẹn của Chúa Ki-tô cho Hội Thánh.", C:"C. Tình yêu giữa Chúa Ki-tô và Hội Thánh là sự trung tín tuyệt đối của Chúa Ki-tô đối với Hội Thánh.", D:"D. Cả A, B và C"}},
        {id:"p1q4", q:"Câu 4: Hôn nhân Công giáo có mấy đặc tính chính yếu?", o:{A:"A. Hôn nhân Công giáo có hai đặc tính là: Đơn hôn (một vợ một chồng) và Tôn trọng nhau suốt đời.", B:"B. Hôn nhân Công giáo có hai đặc tính là: Đơn hôn (một vợ một chồng) và Yêu thương cùng tôn trọng nhau suốt đời.", C:"C. Hôn nhân Công giáo có hai đặc tính là: Đơn hôn (một vợ một chồng) và Bất khả phân ly (không được ly hôn).", D:"D. Cả A, B và C"}},
        {id:"p1q5", q:"Câu 5: Mục đích của Hôn nhân Công giáo là gì ?", o:{A:"A. Mục đích Hôn nhân Công giáo là vợ chồng trọn đời yêu thương nhau, sinh sản và giáo dục con cái và cùng giúp nhau nên thánh.", B:"B. Mục đích Hôn nhân Công giáo là vợ chồng trọn đời yêu thương nhau và cùng giúp nhau nên thánh.", C:"C. Mục đích Hôn nhân Công giáo là vợ chồng trọn đời yêu thương nhau và giúp con cái cùng nên thánh.", D:"D. Cả A, B và C"}},
        {id:"p1q6", q:"Câu 6: Làm thế nào để đôi bạn sống trọn đời yêu thương nhau ?", o:{A:"A. Để sống trọn đời yêu thương nhau, đôi bạn phải sống đạo tốt, đồng thời, phải tôn trọng phẩm giá và quyền lợi chính đáng của bạn đời của mình.", B:"B. Để sống trọn đời yêu thương nhau, đôi bạn phải lưu ý đến nhu cầu cũng như sở thích của người bạn đời. Đồng thời, phải biết luôn làm mới bản thân mình về tâm hồn cũng như thể xác.", C:"C. Để sống trọn đời yêu thương nhau, đôi bạn phải lưu ý đến những khác biệt về tâm sinh lý trong đời sống vợ chồng.", D:"D. Cả A và C"}},
        {id:"p1q7", q:"Câu 7: Việc sinh sản con cái có những ý nghĩa nào ?", o:{A:"A. Việc sinh sản con cái có những ý nghĩa này: Thiên Chúa cho loài người được vinh dự cộng tác với Người trong việc tạo dựng; Con cái là hoa quả tốt đẹp của tình yêu vợ chồng.", B:"B. Việc sinh sản con cái có những ý nghĩa này: Thiên Chúa cho loài người được vinh dự cộng tác với Người trong việc tạo dựng; Con cái là hoa quả tốt đẹp của tình yêu vợ chồng; Góp phần tăng thêm cộng đoàn nhân loại và phát triển Hội Thánh.", C:"C. Việc sinh sản con cái có những ý nghĩa này: Thiên Chúa cho loài người được vinh dự cộng tác với Người trong việc tạo dựng; Con cái là hoa quả tốt đẹp của tình yêu vợ chồng, nên phải nuôi dạy và chăm sóc con cái sao cho xứng với quà tặng mà Thiên Chúa đã thương ban.", D:"D. Cả A, B và C"}},
        {id:"p1q8", q:"Câu 8: Bí tích Hôn nhân giúp đôi bạn nên thánh cách nào ?", o:{A:"A. Nhờ ơn thiêng của Bí tích Hôn nhân, đôi bạn nên thánh trong niềm vui đón nhận nhau, sinh sản và giáo dục con cái.", B:"B. Bí tích Hôn nhân giúp đôi bạn nên thánh trong niềm vui đón nhận nhau, hy sinh cho nhau và cùng nhau đi đến cuối con đường.", C:"C. Bí tích Hôn nhân giúp đôi bạn nên thánh nhờ sự hy sinh và hiến thân cho nhau, để cùng nhau đi đến cuối con đường.", D:"D. Cả A, B và C"}},
        {id:"p1q9", q:"Câu 9: Muốn giáo dục thành công, cha mẹ phải thế nào ?", o:{A:"A. Muốn giáo dục thành công, cha mẹ phải: Thăng tiến và thánh hóa bản thân.", B:"B. Muốn giáo dục thành công, cha mẹ phải: Nhất trí với nhau trong đường hướng và cách thức giáo dục.", C:"C. Muốn giáo dục thành công, cha mẹ phải: Tạo bầu khí gia đình hòa thuận, thánh thiện và tín nhiệm nhau.", D:"D. Cả A, B và C"}},
        {id:"p1q10", q:"Câu 10: Luân lý tính dục trong đời sống Hôn nhân là gì ?", o:{A:"A. Luân lý tính dục trong đời sống Hôn nhân là những lời dạy dỗ và giáo huấn của Giáo Hội, giúp cho đôi vợ chồng sống sao cho xứng với ơn gọi của họ trong giao ước hôn nhân.", B:"B. Luân lý tính dục trong đời sống Hôn nhân là tính cách hợp pháp do chính Thiên Chúa thiết lập cho đời sống vợ chồng.", C:"C. Luân lý tính dục trong đời sống Hôn nhân là những điều răn và giới luật, giúp cho đôi vợ chồng sống sao cho đúng với giáo huấn của Giáo Hội.", D:"D. Cả A, B và C"}},
        {id:"p1q11", q:"Câu 11: Để có quyết định đúng đắn về việc điều hòa sinh sản, đôi bạn phải có những yếu tố nào ?", o:{A:"A. Đôi bạn phải có những yếu tố này: Lương tâm ngay thẳng và tinh thần trách nhiệm cao.", B:"B. Đôi bạn phải có những yếu tố này: Lương tâm ngay thẳng, chân chính. Tinh thần trách nhiệm cao. Tuân giữ giáo huấn của Hội Thánh về việc điều hòa sinh sản.", C:"C. Đôi bạn phải có những yếu tố này: Tinh thần trách nhiệm cao. Tuân giữ giáo huấn của Hội Thánh về việc điều hòa sinh sản.", D:"D. Cả A, B và C"}},
        {id:"p1q12", q:"Câu 12: Các Bí tích giúp gì cho đời sống đôi bạn ?", o:{A:"A. Các Bí tích có mục đích thánh hóa loài người. Riêng đối với đôi bạn, các Bí tích, nhất là Bí tích Giải tội và Thánh Thể, còn thánh hóa tình yêu vợ chồng, ban nhiều ơn sủng, giúp đôi bạn chu toàn trách nhiệm đối với nhau và đối với con cái.", B:"B. Các Bí tích có mục đích thánh hóa loài người, xây dựng nhiệm thể Chúa Ki-tô và thờ phượng Thiên Chúa. Riêng đối với đôi bạn, các Bí tích, nhất là Bí tích Giải tội và Thánh Thể, còn thánh hóa tình yêu vợ chồng, ban nhiều ơn sủng, giúp đôi bạn chu toàn trách nhiệm đối với nhau và đối với con cái.", C:"C. Các Bí tích có mục đích thánh hóa loài người. Riêng đối với đôi bạn, các Bí tích còn thánh hóa tình yêu vợ chồng, ban nhiều ơn sủng, giúp đôi bạn chu toàn trách nhiệm đối với nhau và đối với con cái.", D:"D. Cả A, B và C"}},
        {id:"p1q13", q:"Câu 13: Hôn nhân liên hệ với Bí tích Rửa tội thế nào?", o:{A:"A. Hôn nhân có liên hệ, vì Bí tích Rửa tội là cửa ngõ vào Nước Trời, nên do tình thương và trách nhiệm, cha mẹ phải lo liệu cho con cái được rửa tội theo qui định của Hội Thánh.", B:"B. Hôn nhân có liên hệ, vì chỉ những ai đã rửa tội mới có thể cử hành Bí tích Hôn nhân. Hơn nữa, Bí tích Rửa tội là cửa ngõ vào Nước Trời.", C:"C. Có liên hệ cơ bản, vì chỉ những ai đã rửa tội mới có thể cử hành Bí tích Hôn nhân. Hơn nữa, Bí tích Rửa tội là cửa ngõ vào Nước Trời, nên do tình thương và trách nhiệm, cha mẹ phải lo liệu cho con cái được rửa tội theo qui định của Hội Thánh.", D:"D. Cả A, B và C"}},
        {id:"p1q14", q:"Câu 14: Cha mẹ phải lo liệu việc Rửa tội cho con cái thế nào?", o:{A:"A. Việc rửa tội cho con được chia thành các trường hợp sau: Lúc bình thường: Sau khi sinh con khoảng 1 tháng, cha mẹ cùng người đỡ đầu, đem con đến nhà thờ để linh mục rửa tội.", B:"B. Khi nguy tử: Cha mẹ hoặc người khác rửa tội cho con.", C:"C. Trường hợp sẩy thai bất cứ vào giai đoạn nào cũng phải rửa tội.", D:"D. Cả A, B và C"}},
        {id:"p1q15", q:"Câu 15: Đọc Lời Chúa trong gia đình thì được những ích lợi gì ?", o:{A:"A. Khi đọc Lời Chúa trong gia đình, mọi người được hướng dẫn bởi cùng một giáo huấn nên dễ giúp nhau thực hành Lời Chúa hơn.", B:"B. Khi đọc Lời Chúa trong gia đình, mọi người cùng được nghe, nên sẽ cùng được hướng dẫn bởi cùng một giáo huấn. Hơn nữa, chính Lời Chúa sẽ hướng dẫn từng thành viên, giúp họ biến đổi con người mình. Nhờ đó, mọi thành viên dễ giúp nhau thực hành Lời Chúa hơn.", C:"C. Khi đọc Lời Chúa trong gia đình, mọi người không những được thánh hóa, nuôi dưỡng, mà còn được hướng dẫn bởi cùng một giáo huấn nên dễ giúp nhau thực hành Lời Chúa hơn.", D:"D. Cả A, B và C"}},
        {id:"p1q16", q:"Câu 16: Kinh nguyện trong gia đình có cần thiết không ?", o:{A:"A. Rất cần thiết, vì qua giờ kinh gia đình, mọi thành viên trong gia đình có cơ hội ngồi lại bên nhau. Nhờ ánh sáng Lời Chúa soi chiếu, giúp gia đình sống tốt ơn gọi Ki-tô hữu và dạy con cái biết cầu nguyện.", B:"B. Rất cần thiết, vì Kinh nguyện chung giúp gia đình sống tốt đẹp ơn gọi Ki-tô hữu và dạy con cái biết cầu nguyện.", C:"C. Rất cần thiết, vì qua giờ kinh gia đình, mọi thành viên trong gia đình có cơ hội ngồi lại bên nhau. Nhờ ánh sáng Lời Chúa soi chiếu, giúp các thành viên trong gia đình sống tốt ơn gọi của mỗi người.", D:"D. Cả A, B và C"}},
        {id:"p1q17", q:"Câu 17: Hội Thánh liên hệ thế nào với gia đình ?", o:{A:"A. Hội Thánh sinh ra, dưỡng dục và xây dựng gia đình Công Giáo.", B:"B. Hội Thánh sinh ra gia đình, hay nói cách khác, gia đình là con cái và là một thành phần của Hội Thánh, nên gia đình và Hội Thánh có mối quan hệ hỗ tương với nhau.", C:"C. Gia đình là một thành phần của Hội Thánh, nên gia đình và Hội Thánh có mối quan hệ hỗ tương với nhau, cả hai bên đều phụ thuộc lẫn nhau.", D:"D. Cả A, B và C"}},
        {id:"p1q18", q:"Câu 18: Gia đình liên hệ thế nào với Hội Thánh ?", o:{A:"A. Gia đình là một thành phần của Hội Thánh, vì thế, gia đình dự phần vào sứ mệnh cứu rỗi của Hội Thánh theo cách thức riêng của mình.", B:"B. Gia đình là một thành phần của Hội Thánh, nên gia đình và Hội Thánh có mối quan hệ hỗ tương với nhau, cả hai bên đều phụ thuộc lẫn nhau.", C:"C. Gia đình dự phần vào sứ mệnh cứu rỗi của Hội Thánh theo cách thức riêng của mình.", D:"D. Cả A, B và C"}},
        {id:"p1q19", q:"Câu 19: Gia đình có nghĩa vụ gì đối với Hội Thánh ?", o:{A:"A. Gia đình có nghĩa vụ Hiệp thông với Hội Thánh, đồng thời tuân giữ các giáo huấn của Hội Thánh.", B:"B. Gia đình có nghĩa vụ Hiệp thông với Hội Thánh; tuân giữ các giáo huấn của Hội Thánh; thi hành 3 chức năng Tư tế, Ngôn sứ và Vương giả theo cách thức riêng của mình.", C:"C. Gia đình có nghĩa vụ Hiệp thông với Hội Thánh, tuân giữ và thi hành 3 chức năng Tư tế, Ngôn sứ và Vương giả theo cách thức riêng của mình.", D:"D. Cả A, B và C"}},
        {id:"p1q20", q:"Câu 20: Gia đình và xã hội có liên hệ gì với nhau ?", o:{A:"A. Gia đình và xã hội có liên quan mật thiết với nhau vì: Gia đình là khung cảnh đầu tiên thể hiện tính xã hội của con người và là khung cảnh đầu tiên để con người tập dấn thân hoạt động xã hội.", B:"B. Gia đình và xã hội là hai thực thể riêng biệt và độc lập với nhau.", C:"C. Gia đình và xã hội có liên quan mật thiết với nhau vì: Gia đình là nền tảng của xã hội.", D:"D. Cả A và C"}},
        {id:"p1q21", q:"Câu 21. Sinh sản có trách nhiệm nghĩa là gì?", o:{A:"A. Chỉ cần sinh con theo mong muốn.", B:"B. Khi sinh con, cha mẹ phải lo nuôi dưỡng và giáo dục con nên người.", C:"C. Sinh càng nhiều con càng tốt.", D:"D. Không cần quan tâm đến việc giáo dục con."}},
        {id:"p1q22", q:"Câu 22. Vì sao vợ chồng cần sinh sản có trách nhiệm?", o:{A:"A. Để có nhiều con hơn.", B:"B. Để tránh mọi khó khăn trong gia đình.", C:"C. Để thi hành đúng ý định của Thiên Chúa và đáp ứng tình yêu vợ chồng.", D:"D. Để gia đình được giàu có."}},
        {id:"p1q23", q:"Câu 23. Một trong những thái độ cần có của vợ chồng Kitô hữu khi sinh sản có trách nhiệm là gì?", o:{A:"A. Làm chủ bản năng tính dục.", B:"B. Luôn sinh thật nhiều con.", C:"C. Chỉ quyết định một mình.", D:"D. Không cần quan tâm hoàn cảnh gia đình."}},
        {id:"p1q24", q:"Câu 24. Khi quyết định sinh con hay tạm ngừng, vợ chồng cần làm gì?", o:{A:"A. Người chồng tự quyết định.", B:"B. Người vợ tự quyết định.", C:"C. Cùng nhau xem xét hoàn cảnh cụ thể và quyết định.", D:"D. Nhờ người khác quyết định thay."}},
        {id:"p1q25", q:"Câu 25. Cách thức ngừa thai tự nhiên là gì?", o:{A:"A. Dùng thuốc tránh thai.", B:"B. Dùng bao cao su.", C:"C. Tiết dục định kỳ, kiêng cữ trong thời kỳ người vợ dễ thụ thai.", D:"D. Thắt ống dẫn tinh."}},
        {id:"p1q26", q:"Câu 26. Phương pháp Ogino dựa vào yếu tố nào để xác định ngày trứng rụng?", o:{A:"A. Chu kỳ kinh nguyệt.", B:"B. Chất nhờn.", C:"C. Nhiệt độ cơ thể.", D:"D. Nhịp tim."}},
        {id:"p1q27", q:"Câu 27. Phương pháp Billings dựa vào hiện tượng nào?", o:{A:"A. Chu kỳ kinh nguyệt.", B:"B. Chất nhờn.", C:"C. Nhiệt độ cơ thể.", D:"D. Huyết áp."}},
        {id:"p1q28", q:"Câu 28. Người Công giáo được sử dụng cách thức nào để ngừa thai?", o:{A:"A. Ngừa thai nhân tạo.", B:"B. Ngừa thai bằng thuốc.", C:"C. Cách thức ngừa thai tự nhiên khi có lý do chính đáng.", D:"D. Bất kỳ phương pháp nào."}},
        {id:"p1q29", q:"Câu 29. Phương pháp nào sau đây là cách thức ngừa thai nhân tạo?", o:{A:"A. Tiết dục định kỳ.", B:"B. Phương pháp Ogino.", C:"C. Phương pháp Billings.", D:"D. Dùng bao cao su."}},
        {id:"p1q30", q:"Câu 30. Phá thai được nhìn nhận như thế nào?", o:{A:"A. Là việc không có vấn đề về luân lý.", B:"B. Là tội nhẹ.", C:"C. Là tội rất nặng vì đây là tội giết người.", D:"D. Chỉ là vấn đề cá nhân."}},
        {id:"p1q31", q:"Câu 31: Hôn nhân liên hệ với Bí tích Rửa tội thế nào?", o:{A:"A. Hôn nhân có liên hệ, vì Bí tích Rửa tội là cửa ngõ vào Nước Trời, nên do tình thương và trách nhiệm, cha mẹ phải lo liệu cho con cái được rửa tội theo qui định của Hội Thánh.", B:"B. Hôn nhân có liên hệ, vì chỉ những ai đã rửa tội mới có thể cử hành Bí tích Hôn nhân. Hơn nữa, Bí tích Rửa tội là cửa ngõ vào Nước Trời.", C:"C. Có liên hệ cơ bản, vì chỉ những ai đã rửa tội mới có thể cử hành Bí tích Hôn nhân. Hơn nữa, Bí tích Rửa tội là cửa ngõ vào Nước Trời, nên do tình thương và trách nhiệm, cha mẹ phải lo liệu cho con cái được rửa tội theo qui định của Hội Thánh.", D:"D. Cả A, B và C"}},
        {id:"p1q32", q:"Câu 32: Đọc Lời Chúa trong gia đình thì được những ích lợi gì ?", o:{A:"A. Khi đọc Lời Chúa trong gia đình, mọi người được hướng dẫn bởi cùng một giáo huấn nên dễ giúp nhau thực hành Lời Chúa hơn.", B:"B. Khi đọc Lời Chúa trong gia đình, mọi người cùng được nghe, nên sẽ cùng được hướng dẫn bởi cùng một giáo huấn. Hơn nữa, chính Lời Chúa sẽ hướng dẫn từng thành viên, giúp họ biến đổi con người mình. Nhờ đó, mọi thành viên dễ giúp nhau thực hành Lời Chúa hơn.", C:"C. Khi đọc Lời Chúa trong gia đình, mọi người không những được thánh hóa, nuôi dưỡng, mà còn được hướng dẫn bởi cùng một giáo huấn nên dễ giúp nhau thực hành Lời Chúa hơn.", D:"D. Cả A, B và C"}},
        {id:"p1q33", q:"Câu 33: Kinh nguyện trong gia đình có cần thiết không ?", o:{A:"A. Rất cần thiết, vì qua giờ kinh gia đình, mọi thành viên trong gia đình có cơ hội ngồi lại bên nhau. Nhờ ánh sáng Lời Chúa soi chiếu, giúp gia đình sống tốt ơn gọi Ki-tô hữu và dạy con cái biết cầu nguyện.", B:"B. Rất cần thiết, vì Kinh nguyện chung giúp gia đình sống tốt đẹp ơn gọi Ki-tô hữu và dạy con cái biết cầu nguyện.", C:"C. Rất cần thiết, vì qua giờ kinh gia đình, mọi thành viên trong gia đình có cơ hội ngồi lại bên nhau. Nhờ ánh sáng Lời Chúa soi chiếu, giúp các thành viên trong gia đình sống tốt ơn gọi của mỗi người.", D:"D. Cả A, B và C"}},
        {id:"p1q34", q:"Câu 34: Hội Thánh liên hệ thế nào với gia đình ?", o:{A:"A. Hội Thánh sinh ra, dưỡng dục và xây dựng gia đình Công Giáo.", B:"B. Hội Thánh sinh ra gia đình, hay nói cách khác, gia đình là con cái và là một thành phần của Hội Thánh, nên gia đình và Hội Thánh có mối quan hệ hỗ tương với nhau.", C:"C. Gia đình là một thành phần của Hội Thánh, nên gia đình và Hội Thánh có mối quan hệ hỗ tương với nhau, cả hai bên đều phụ thuộc lẫn nhau.", D:"D. Cả A, B và C"}},
        {id:"p1q35", q:"Câu 35: Gia đình liên hệ thế nào với Hội Thánh ?", o:{A:"A. Gia đình là một thành phần của Hội Thánh, vì thế, gia đình dự phần vào sứ mệnh cứu rỗi của Hội Thánh theo cách thức riêng của mình.", B:"B. Gia đình là một thành phần của Hội Thánh, nên gia đình và Hội Thánh có mối quan hệ hỗ tương với nhau, cả hai bên đều phụ thuộc lẫn nhau.", C:"C. Gia đình dự phần vào sứ mệnh cứu rỗi của Hội Thánh theo cách thức riêng của mình.", D:"D. Cả A, B và C"}},
        {id:"p1q36", q:"Câu 36: Gia đình có nghĩa vụ gì đối với Hội Thánh ?", o:{A:"A. Gia đình có nghĩa vụ Hiệp thông với Hội Thánh, đồng thời tuân giữ các giáo huấn của Hội Thánh.", B:"B. Gia đình có nghĩa vụ Hiệp thông với Hội Thánh; tuân giữ các giáo huấn của Hội Thánh; thi hành 3 chức năng Tư tế, Ngôn sứ và Vương giả theo cách thức riêng của mình.", C:"C. Gia đình có nghĩa vụ Hiệp thông với Hội Thánh, tuân giữ và thi hành 3 chức năng Tư tế, Ngôn sứ và Vương giả theo cách thức riêng của mình.", D:"D. Cả A, B và C"}},
        {id:"p1q37", q:"Câu 37: Gia đình và xã hội có liên hệ gì với nhau ?", o:{A:"A. Gia đình và xã hội có liên quan mật thiết với nhau vì: Gia đình là khung cảnh đầu tiên thể hiện tính xã hội của con người và là khung cảnh đầu tiên để con người tập dấn thân hoạt động xã hội.", B:"B. Gia đình và xã hội là hai thực thể riêng biệt và độc lập với nhau.", C:"C. Gia đình và xã hội có liên quan mật thiết với nhau vì: Gia đình là nền tảng của xã hội.", D:"D. Cả A và C"}}
    ];

    const p2 = [
        {id:"p2q1", q:"Câu 1: Bí tích Rửa Tội có cần thiết cho ơn cứu độ không?", o:{A:"A. Bí tích Rửa Tội rất cần thiết, vì Chúa Giêsu đã nói: “Ai tin và chịu phép Rửa, sẽ được cứu độ”.", B:"B. Nên lãnh nhận bí tích Rửa Tội, vì đây là bí tích Chúa Giêsu thiết lập, tuy nhiên không buộc phải lãnh nhận vì còn 6 bí tích khác.", C:"C. Không cần thiết, vì người Ki-tô hữu buộc phải lãnh nhận đủ 7 bí tích.", D:"D. Bí tích Rửa Tội cần thiết, vì đây là bí tích Chúa Giêsu thiết lập và trao lại cho Giáo Hội cử hành"}},
        {id:"p2q2", q:"Câu 2: Theo định nghĩa, Bí tích Thánh Tẩy làm cho người lãnh nhận được gì?", o:{A:"A. Trở thành người giàu có và bình an.", B:"B. Giải thoát khỏi tội lỗi, tái sinh làm con Thiên Chúa, thành chi thể Đức Kitô và thành viên Hội Thánh.", C:"C. Được chữa lành mọi bệnh tật thể xác.", D:"D. Trở thành linh mục hoặc tu sĩ."}},
        {id:"p2q3", q:"Câu 3: Khi lãnh nhận Bí tích Thánh Tẩy, chúng ta được rửa sạch những tội nào?", o:{A:"A. Chỉ tội cá nhân.", B:"B. Chỉ tội tổ tông.", C:"C. Mọi tội lỗi (tội tổ tông và tội riêng nếu có).", D:"D. Tội lỗi trong tương lai."}},
        {id:"p2q4", q:"Câu 4: Tên gọi 'Rửa Tội' phổ biến nhất vì nó nhấn mạnh đến yếu tố nào?", o:{A:"A. Lời thề hứa của người nhận.", B:"B. Hành động đổ nước trên đầu người lãnh nhận để thanh tẩy.", C:"C. Sự hiện diện của Chúa Thánh Thần.", D:"D. Việc xức dầu thánh."}},
        {id:"p2q5", q:"Câu 5: Ba Bí tích Khai tâm bao gồm những bí tích nào?", o:{A:"A. Rửa Tội, Hòa Giải, Thánh Thể", B:"B. Rửa Tội, Thêm Sức, Hôn Phối", C:"C. Rửa Tội, Thêm Sức, Thánh Thể", D:"D. Rửa Tội, Xức Dầu Bệnh Nhân, Truyền Chức"}},
        {id:"p2q6", q:"Câu 6: Tại sao Bí tích Rửa Tội đôi khi được gọi là 'bí tích của kẻ chết'?", o:{A:"A. Vì dành cho người đã qua đời.", B:"B. Vì người phạm tội như đã chết về linh hồn, bí tích này mang lại sự sống ân sủng mới.", C:"C. Vì người lãnh nhận phải mặc áo đen.", D:"D. Vì nó gợi nhớ đến sự chết của Chúa Giêsu."}},
        {id:"p2q7", q:"Câu 7: Lời nguyện Trừ Tà và Xức Dầu Dự tòng có ý nghĩa gì?", o:{A:"A. Giúp người lãnh nhận có sức khỏe thể xác.", B:"B. Cầu xin sức mạnh của Chúa Kitô giúp bảo vệ, can đảm từ bỏ tội lỗi và chiến thắng cám dỗ.", C:"C. Giúp người lãnh nhận trở nên thông minh hơn.", D:"D. Để tẩy sạch tội lỗi ngay lập tức."}},
        {id:"p2q8", q:"Câu 8: Hành động dìm hoặc đổ nước ba lần trong nghi thức Rửa Tội biểu lộ điều gì?", o:{A:"A. Cái chết đối với tội lỗi và đồng hình đồng dạng với Đức Kitô để bước vào sự sống mới.", B:"B. Sự thanh tẩy cơ thể khỏi bụi bẩn.", C:"C. Việc được ghi tên vào sổ Giáo xứ.", D:"D. Tượng trưng cho ba ngày Chúa Giêsu nằm trong mồ."}},
        {id:"p2q9", q:"Câu 9: Lời đọc bắt buộc của chủ sự khi đổ nước Rửa Tội là gì?", o:{A:"A. 'Tôi thanh tẩy bạn cho sạch mọi tội lỗi.'", B:"B. 'Con được trở thành người Công giáo từ nay.", C:"C. 'Xin Chúa ban bình an cho con.'", D:"D. '(Tên thánh), Cha (Tôi) rửa con, nhân danh Cha, và Con, và Thánh Thần.'"}},
        {id:"p2q10", q:"Câu 10: Việc Xức Dầu Thánh (Chrism) chia sẻ 3 chức vụ nào của Chúa Ki-tô?", o:{A:"A. Giám mục, Linh mục, Phó tế.", B:"B. Dạy học, Chữa bệnh, Cầu nguyện.", C:"C. Tư tế, Tiên tri, Vương đế.", D:"D. Rao giảng, Rửa tội, Thêm sức."}},
        {id:"p2q11", q:"Câu 11: Việc trao áo trắng cho người mới Rửa Tội mang ý nghĩa gì?", o:{A:"A. Để mặc cho đẹp trong ngày lễ.", B:"B. Tượng trưng cho việc đã được rửa sạch tì ố, 'mặc lấy Đức Kitô' và sống đời tinh tuyền.", C:"C. Thể hiện sự giàu có của gia đình.", D:"D. Để phân biệt với những người chưa Rửa Tội."}},
        {id:"p2q12", q:"Câu 12: Ánh sáng từ cây nến được trao cho người mới Rửa Tội mang ý nghĩa gì?", o:{A:"A. Tượng trưng Đức Kitô chiếu rọi linh hồn họ, mời gọi họ thành 'ánh sáng cho trần gian'.", B:"B. Soi sáng đường đi trong bóng tối.", C:"C. Để làm ấm không gian nhà thờ.", D:"D. Dùng để thắp sáng bàn thờ gia đình sau này."}},
        {id:"p2q13", q:"Câu 13: Trong điều kiện bình thường, ai là thừa tác viên thông thường của Bí tích Rửa Tội?", o:{A:"A. Chỉ có Giám mục.", B:"B. Giám mục, Linh mục, Phó tế.", C:"C. Bất cứ người Công giáo nào.", D:"D. Chỉ có Linh mục xứ."}},
        {id:"p2q14", q:"Câu 14: Trong trường hợp khẩn cấp (nguy hiểm tính mạng), ai có thể ban Bí tích Rửa Tội?", o:{A:"A. Chỉ tu sĩ nam nữ.", B:"B. Chỉ giáo lý viên.", C:"C. Bất cứ ai (kể cả người chưa chịu phép rửa) miễn là làm đúng ý hướng của Hội Thánh.", D:"D. Chỉ người có chức thánh."}},
        {id:"p2q15", q:"Câu 15: Điều kiện bắt buộc để một người bình thường cử hành Rửa Tội trong trường hợp khẩn cấp là gì?", o:{A:"A. Phải mặc áo lễ và đọc toàn bộ nghi thức.", B:"B. Phải có ý hướng của Hội Thánh, đổ nước lên đầu và đọc đúng công thức Rửa Tội.", C:"C. Phải có giấy phép của Giám mục.", D:"D. Phải làm dấu Thánh Giá 3 lần."}},
        {id:"p2q16", q:"Câu 16: Ai là người có khả năng lãnh nhận Bí tích Rửa Tội?", o:{A:"A. Chỉ những trẻ sơ sinh.", B:"B. Chỉ những người lớn đã học giáo lý.", C:"C. Tất cả và chỉ những người chưa chịu Phép Rửa.", D:"D. Bất cứ ai, kể cả người đã Rửa Tội rồi."}},
        {id:"p2q17", q:"Câu 17: Tại sao mỗi người chỉ được lãnh nhận Bí tích Rửa Tội một lần duy nhất trong đời?", o:{A:"A. Vì nghi thức này rất dài và phức tạp.", B:"B. Vì Hội Thánh quy định như vậy để tiết kiệm thời gian.", C:"C. Vì Bí tích này in vào linh hồn một 'ấn tín thiêng liêng' vĩnh viễn không thể tẩy xóa.", D:"D. Vì nước thánh chỉ có tác dụng một lần."}},
        {id:"p2q18", q:"Câu 18: Để được lãnh nhận Rửa Tội, người lớn cần phải trải qua giai đoạn chuẩn bị nào?", o:{A:"A. Trải qua một kỳ tĩnh tâm 3 ngày.", B:"B. Thời kỳ học đạo (thời kỳ dự tòng).", C:"C. Đi phục vụ cộng đồng 1 tháng.", D:"D. Đóng góp tài chính cho giáo xứ."}},
        {id:"p2q19", q:"Câu 19: Trẻ em sơ sinh được Rửa Tội dựa trên đức tin của ai?", o:{A:"A. Của chính đứa trẻ.", B:"B. Của cộng đồng xã hội.", C:"C. Của linh mục làm phép Rửa.", D:"D. Của cha mẹ, người đỡ đầu và toàn thể Hội Thánh."}},

        {id:"p3q5", q:"Câu 5: Anh (chị) hãy hoàn tất lời kinh sau đây trong Kinh Tám mối Phúc thật: « Thứ tư : Ai khao khát nhân đức trọn lành, ấy là phúc thật, vì chưng sẽ được… »", o:{A:"A. No đủ vậy", B:"B. Yên ủi vậy", C:"C. Gọi là Con Đức Chúa Trời vậy", D:"D. Tất cả đều sai"}}

    const p4_essay = [
        {id: "tl4_1", q: "Câu 1: Anh (chị) hãy điền vào chỗ trống hoàn tất câu Kinh Thánh sau: \"Lạy Cha, xin cho họ được hoàn toàn ...; như vậy, thế gian sẽ nhận biết là chính Cha đã sai Con và đã yêu thương họ như đã yêu thương Con.\" (Ga 17, 23)"},
        {id: "tl4_2", q: "Câu 2: Anh (chị) hãy hoàn tất câu Kinh Thánh sau: “Anh em là giống nòi được tuyển chọn, là hoàng tộc chuyên lo tế tự, là dân thánh” dân riêng của Thiên Chúa, để … những công trình vĩ đại của Người, Đấng đã gọi anh em ra khỏi miền u tối, vào nơi đầy ánh sáng diệu huyền.\" (1Pr 2, 9)"},
        {id: "tl4_3", q: "Câu 3: Anh (chị) hãy hoàn tất câu Kinh Thánh sau: “Đức mến thì nhẫn nhục, hiền hậu, không nóng giận, không nuôi hận thù. Đức mến … tất cả, … tất cả, … tất cả” (1Cr 13, 4-7)"},
        {id: "tl4_4", q: "Câu 4: Anh (chị) hãy hoàn tất câu Kinh Thánh sau: “Lạy Thầy, khi anh em xúc phạm đến con, con phải tha thứ cho họ mấy lần. Có phải đến bảy lần không?” Chúa Giêsu đáp: “Thầy không bảo con phải tha đến bảy lần, nhưng đến ....”"}

    // Khởi tạo giao diện
    function renderQuiz() {
        let html = '';
        const sections = [
            { title: "PHẦN I - TRẮC NGHIỆM GIÁO LÝ HÔN NHÂN", data: p1 },
            { title: "PHẦN II. TRẮC NGHIỆM GIÁO LÝ CĂN BẢN", data: p2 },
            { title: "PHẦN III. TRẮC NGHIỆM KINH BỔN", data: p3 }
        ];

        sections.forEach(sec => {
            html += `<h3>${sec.title}</h3>`;
            sec.data.forEach(item => {
                html += `<div class="question"><p><b>${item.q}</b></p>`;
                for(let key in item.o) {
                    html += `<label><input type="radio" name="${item.id}" value="${key}" required> ${item.o[key]}</label>`;
                }
                html += `</div>`;
            });
        });

        const essaySections = [
            { title: "PHẦN IV – TỰ LUẬN (điền đáp án vào chỗ trống)", data: p4_essay },
            { title: "PHẦN V – TỰ LUẬN - SỐNG HÔN NHÂN (điền đáp án vào chỗ trống)", data: p5_essay }
        ];

        essaySections.forEach(sec => {
            html += `<h3>${sec.title}</h3>`;
            sec.data.forEach(item => {
                html += `<div class="question"><p><b>${item.q}</b></p>`;
                html += `<textarea name="${item.id}" rows="4" placeholder="Nhập câu trả lời của bạn..." required></textarea></div>`;
            });
        });

        document.getElementById('quiz-content').innerHTML = html;
    }

    renderQuiz(); // Gọi hàm render khi web tải xong

    let timeInSeconds = 60 * 60; // 60 phút
    let timerInterval;

    function startQuiz() {
        const sbd = document.getElementById('sbd').value.trim();
        const hoTen = document.getElementById('hoTen').value.trim();
        const ngaySinh = document.getElementById('ngaySinh').value;

        if (!sbd || !hoTen || !ngaySinh) {
            alert('Vui lòng điền đầy đủ SBD, Họ tên và Ngày sinh!');
            return;
        }

        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('quiz-section').classList.remove('hidden');

        timerInterval = setInterval(() => {
            timeInSeconds--;
            let m = Math.floor(timeInSeconds / 60).toString().padStart(2, '0');
            let s = (timeInSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${m}:${s}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                alert("Đã hết thời gian làm bài! Hệ thống tự động nộp bài.");
                submitQuiz();
            }
        }, 1000);
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        document.querySelector("button[onclick='submitQuiz()']").innerText = "Đang nộp bài, vui lòng đợi...";
        document.querySelector("button[onclick='submitQuiz()']").disabled = true;

        const form = document.getElementById('quizForm');
        const formData = new FormData(form);
        
        let dataToSubmit = {
            sbd: document.getElementById('sbd').value.trim(),
            hoTen: document.getElementById('hoTen').value.trim(),
            ngaySinh: document.getElementById('ngaySinh').value
        };

        // Gom toàn bộ đáp án trắc nghiệm và tự luận
        for (let [key, value] of formData.entries()) {
            dataToSubmit[key] = value;
        }

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(dataToSubmit),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                alert(data.message);
                document.getElementById('quiz-section').innerHTML = `<h2 style='color:green; text-align:center;'>${data.message}</h2><p style='text-align:center;'>Phần tự luận sẽ được giáo viên chấm và công bố sau.</p>`;
            } else {
                alert("LỖI: " + data.message);
                document.querySelector("button[onclick='submitQuiz()']").innerText = "Nộp Bài";
                document.querySelector("button[onclick='submitQuiz()']").disabled = false;
            }
        }).catch(err => {
            alert("Có lỗi kết nối. Hãy thử nộp lại!");
        });
    }
</script>

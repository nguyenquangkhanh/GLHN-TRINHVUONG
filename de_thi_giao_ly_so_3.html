<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đề Thi Giáo Lý Thêm Sức - Số III</title>
<style>
  :root{
    --navy:#0a1f44;
    --navy-light:#1b3a6b;
    --navy-accent:#274a7a;
    --gold:#c9a227;
    --green:#1f7a3d;
    --red:#b3261e;
    --bg:#eef2f8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    font-size:18px;
    background:var(--bg);
    color:var(--navy);
    margin:0;
    padding:20px;
  }
  .container{
    max-width:800px;
    margin:0 auto;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:20px 24px;
    border-radius:10px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  header .titles h1{
    margin:0 0 4px 0;
    font-size:22px;
  }
  header .titles p{
    margin:0;
    color:#cdd9ee;
    font-size:16px;
  }
  #score-badge{
    background:var(--gold);
    color:var(--navy);
    font-weight:800;
    font-size:18px;
    padding:8px 16px;
    border-radius:20px;
    white-space:nowrap;
  }
  #progress-bar-wrap{
    background:#d7e0f0;
    border-radius:20px;
    height:14px;
    margin-bottom:8px;
    overflow:hidden;
  }
  #progress-bar{
    background:var(--gold);
    height:100%;
    width:0%;
    transition:width .3s ease;
  }
  #progress-label{
    text-align:right;
    color:var(--navy-light);
    font-size:15px;
    margin-bottom:18px;
  }
  .section-title{
    color:var(--navy);
    border-left:6px solid var(--gold);
    padding-left:12px;
    margin:0 0 14px 0;
    font-size:19px;
    font-weight:700;
  }
  .card{
    background:#fff;
    border:2px solid var(--navy-accent);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:18px;
    min-height:320px;
  }
  .q-title{
    font-weight:700;
    color:var(--navy);
    margin-bottom:16px;
    font-size:19px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    border:2px solid #c7d3e8;
    border-radius:8px;
    cursor:pointer;
    background:#f6f8fc;
    transition:.15s;
  }
  .option:hover{
    border-color:var(--navy-light);
    background:#e9eef8;
  }
  .option input{
    margin-top:4px;
    transform:scale(1.2);
    accent-color:var(--navy);
  }
  .option.correct{
    background:#e3f4e8;
    border-color:var(--green);
    color:var(--green);
    font-weight:700;
  }
  .option.incorrect{
    background:#fbe6e5;
    border-color:var(--red);
    color:var(--red);
    font-weight:700;
  }
  .option.disabled{
    pointer-events:none;
  }
  #feedback{
    margin-top:16px;
    padding:12px 16px;
    border-radius:8px;
    font-weight:700;
    font-size:19px;
    display:none;
  }
  #feedback.correct-fb{
    background:#e3f4e8;
    color:var(--green);
    display:block;
  }
  #feedback.incorrect-fb{
    background:#fbe6e5;
    color:var(--red);
    display:block;
  }
  .nav-row{
    display:flex;
    justify-content:flex-end;
  }
  #next-btn{
    padding:14px 28px;
    font-size:19px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:10px;
    cursor:pointer;
    display:none;
  }
  #next-btn:hover{
    background:var(--navy-light);
  }
  #result{
    display:none;
    background:var(--navy);
    color:#fff;
    padding:28px;
    border-radius:10px;
    text-align:center;
    margin-bottom:24px;
  }
  #result h2{
    margin-top:0;
    font-size:28px;
    color:var(--gold);
  }
  #result p{
    font-size:20px;
  }
  #restart-btn{
    display:block;
    width:100%;
    padding:16px;
    font-size:20px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
  }
  #restart-btn:hover{
    background:var(--navy-light);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="titles">
      <h1>TRẮC NGHIỆM</h1>
      <p>ĐỀ THI SỐ III</p>
    </div>
    <div id="score-badge">Đúng: 0</div>
  </header>

  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="progress-label"></div>

  <div id="result">
    <h2 id="score-text"></h2>
    <p id="score-detail"></p>
    <button id="restart-btn" type="button">LÀM LẠI</button>
  </div>

  <div id="quiz-area">
    <div class="section-title" id="section-title" style="display:none;"></div>
    <div class="card">
      <div class="q-title" id="q-title"></div>
      <div class="options" id="options"></div>
      <div id="feedback"></div>
    </div>
    <div class="nav-row">
      <button id="next-btn" type="button">CÂU TIẾP THEO →</button>
    </div>
  </div>
</div>

<script>
const quizData = [
 {section:"PHẦN I - GIÁO LÝ (5 điểm)", q:"Câu 1: Phụng vụ là gì?", options:{A:"Phụng vụ là việc Hội Thánh chính thức cử hành mầu nhiệm Đức Ki-tô, để thờ phượng Thiên Chúa và thánh hóa con người.",B:"Phụng vụ là việc Hội Thánh chính thức cử hành, để thờ phượng Thiên Chúa và thánh hóa con người.",C:"Phụng vụ là những cử hành, để thờ phượng Thiên Chúa và thánh hóa con người.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 2: Năm Phụng vụ được tổ chức thế nào?", options:{A:"Năm Phụng vụ được tổ chức thành các mùa là mùa Vọng, mùa Giáng sinh, mùa Chay và mùa Phục sinh.",B:"Năm Phụng vụ được tổ chức thành các mùa là mùa Vọng, mùa Giáng sinh, mùa Phục sinh và mùa Thường niên.",C:"Năm Phụng vụ được tổ chức thành các mùa là mùa Vọng, mùa Giáng sinh, mùa Chay, mùa Phục sinh và mùa Thường niên.",D:"Tất cả đều đúng"}, answer:"C"},
 {q:"Câu 3: Ấn tín bí tích là gì?", options:{A:"Là dấu ấn thiêng liêng Thiên Chúa in vào lòng những người lãnh nhận Bí tích Rửa Tội, Thêm Sức, Truyền Chức Thánh, như lời hứa và bảo đảm cho sự che chở của Ngài. Vì ấn tín không thể xóa được, nên các bí tích này chỉ được lãnh một lần mà thôi.",B:"Là dấu ấn thiêng liêng Thiên Chúa in vào lòng những người lãnh nhận Bí tích Rửa Tội, Thêm Sức, Hôn Phối, như lời hứa và bảo đảm cho sự che chở của Ngài. Vì ấn tín không thể xóa được, nên các bí tích này chỉ được lãnh một lần mà thôi.",C:"Là dấu ấn thiêng liêng Thiên Chúa in vào lòng những người lãnh nhận Bí tích Rửa Tội, Xức Dầu, Truyền Chức Thánh, như lời hứa và bảo đảm cho sự che chở của Ngài. Vì ấn tín không thể xóa được, nên các bí tích này chỉ được lãnh một lần mà thôi.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 4: Vì sao các Bí tích cần thiết cho ơn cứu độ?", options:{A:"Vì các bí tích trao ban ân sủng của Chúa Thánh Thần, nên những người không lãnh bí tích, thì không thể vào Nước Thiên Chúa được.",B:"Vì các bí tích trao ban ân sủng của Chúa Thánh Thần, cùng các ơn riêng tùy theo từng người; nên những người không lãnh bí tích, thì không thể vào Nước Thiên Chúa được.",C:"Vì các bí tích trao ban ân sủng của Chúa Thánh Thần, để Ngài chữa lành và biến đổi chúng ta.",D:"Cả A, B và C"}, answer:"C"},
 {q:"Câu 5: Bí tích Xức Dầu bệnh nhân là gì?", options:{A:"Là bí tích Chúa Giê-su đã lập, để ban ơn nâng đỡ bệnh nhân và người già yếu, về phần hồn cũng như phần xác.",B:"Là bí tích Chúa Giê-su đã lập, để ban ơn nâng đỡ và chữa lành các bệnh tật cho bệnh nhân và người già yếu, về phần hồn cũng như phần xác.",C:"Là bí tích Chúa Giê-su đã lập, để nâng đỡ và chữa lành các bệnh tật cho bệnh nhân, cùng ban ơn phần hồn cũng như phần xác.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 6: Bí tích Xức Dầu có những hiệu quả nào?", options:{A:"Bí tích Xức Dầu kết hợp bệnh nhân với cuộc khổ nạn của Chúa Ki-tô, để sinh ích cho họ và cho Hội Thánh;",B:"Bí tích Xức Dầu Mang lại cho họ niềm an ủi và lòng can đảm, để chịu đựng những đau đớn của bệnh tật hoặc tuổi già;",C:"Bí tích Xức Dầu thứ tha các tội lỗi đã phạm nếu chưa xưng được; Chữa lành thân xác nếu phù hợp với ý Chúa, đồng thời, chuẩn bị cho \"cuộc vượt qua\" sang cõi sống đời đời.",D:"Cả A, B và C"}, answer:"D"},
 {q:"Câu 7: Những dấu nào cho biết mình có ơn gọi sống đời thánh hiến?", options:{A:"Có ba dấu này: một là có ý ngay lành và ước muốn dấn thân phục vụ Chúa và tha nhân; hai là có đủ sức khỏe cũng như trình độ mà Hội Thánh quy định và ba là được những người có trách nhiệm tuyển chọn.",B:"Có ba dấu này: một là có lòng ước muốn dấn thân phục vụ Chúa và tha nhân; hai là có đủ trình độ như Hội Thánh quy định và ba là được những người có trách nhiệm tuyển chọn.",C:"Có ba dấu này: một là có ý ngay lành và ước muốn dấn thân phục vụ Chúa và tha nhân; hai là có đủ điều kiện Hội Thánh quy định và ba là được những người có trách nhiệm tuyển chọn.",D:"Tất cả đều sai"}, answer:"C"},
 {q:"Câu 8: Bí tích Truyền Chức Thánh là gì?", options:{A:"Là Bí tích Chúa Giê-su đã lập, để trao ban cho những người Ngài chọn, để họ tiếp tục thực thi trong Hội Thánh cho đến ngày tận thế.",B:"Là Bí tích Chúa Giê-su đã lập, để ủy thác sứ vụ của Ngài cho các Tông đồ, nhờ đó, sứ vụ này tiếp tục thực thi trong Hội Thánh cho đến ngày tận thế.",C:"Là Bí tích Chúa Giê-su đã lập, để trao ban cho những người Ngài chọn, để họ trở nên những chứng nhân của Chúa và Hội Thánh cho đến ngày tận thế.",D:"Tất cả đều đúng"}, answer:"B"},
 {q:"Câu 9: Người tín hữu có bổn phận nào đối với các vị chủ chăn của mình?", options:{A:"Người tín hữu có bổn phận cầu nguyện và cộng tác với các vị chủ chăn của mình trong việc xây dựng Hội Thánh, đồng thời giúp đỡ các ngài cả về tinh thần lẫn vật chất.",B:"Người tín hữu có bổn phận cầu nguyện, tôn trọng, vâng lời và cộng tác với các vị chủ chăn của mình trong việc xây dựng Hội Thánh, đồng thời giúp đỡ các ngài cả về tinh thần lẫn vật chất.",C:"Người tín hữu có bổn phận cầu nguyện, tôn trọng, vâng lời và cộng tác với các vị chủ chăn của mình trong việc xây dựng Hội Thánh.",D:"Tất cả đều đúng"}, answer:"B"},
 {q:"Câu 10: Gia đình có vai trò nào trong xã hội?", options:{A:"Gia đình là tế bào đầu tiên và là nền móng để xây dựng một xã hội vững bền.",B:"Gia đình là nền móng đầu tiên để xây dựng một xã hội vững bền. Nếu một gia đình hạnh phúc và hiệp thông, xã hội sẽ bình an và thịnh vượng và ngược lại, nếu gia đình bất hòa chia rẽ, xã hội sẽ khó lòng phát triển.",C:"Gia đình là nền móng đầu tiên để xây dựng một xã hội vững bền. Vì là nền móng, nên gia đình có vị trí vô cùng quan trọng trong xã hội.",D:"Tất cả đều đúng"}, answer:"A"},
 {q:"Câu 11: Vì sao gia đình Công giáo được gọi là \"Hội Thánh tại gia\"?", options:{A:"Gia đình Công giáo được gọi là \"Hội Thánh tại gia\" vì gia đình Công Giáo biểu lộ bản chất của Hội Thánh là gia đình của Thiên Chúa.",B:"Vì gia đình Công giáo vừa là cộng đoàn ân sủng và cầu nguyện, trường dạy các đức tính nhân bản và Ki-tô giáo, vừa là nơi đầu tiên đức tin được loan truyền cho con cái.",C:"Vì gia đình Công giáo bao gồm những phần tử đã được thánh hiến qua Bí tích Rửa Tội, nhờ đó, họ được trở nên thánh thiện.",D:"Cả A và B"}, answer:"D"},
 {q:"Câu 12: Bí tích Thêm Sức là gì?", options:{A:"Là Bí tích Chúa Giê-su đã lập, để ban tràn đầy Chúa Thánh Thần, hầu giúp chúng ta sống ơn Bí tích Rửa Tội cách mạnh mẽ và tốt đẹp hơn.",B:"Là Bí tích Chúa Giê-su đã lập, trước khi Ngài về trời, để ban tràn đầy Chúa Thánh Thần, hầu giúp chúng ta sống ơn Bí tích Rửa Tội cách mạnh mẽ và tốt đẹp hơn.",C:"Là Bí tích Chúa Giê-su đã lập, trước khi Ngài về trời, để ban tràn đầy Chúa Thánh Thần và những cần thiết khác, hầu giúp chúng ta sống ơn Bí tích Rửa Tội cách mạnh mẽ và tốt đẹp hơn.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 13: Những ai là thừa tác viên của Bí tích Thêm Sức?", options:{A:"Thừa tác viên thông thường là Giám mục và những linh mục được chỉ định; nhưng trong trường hợp khẩn cấp thì bất cứ ai cũng đều có nhiệm vụ ban bí tích này.",B:"Thừa tác viên thông thường là Giám mục và những linh mục được chỉ định; nhưng trong trường hợp khẩn cấp thì bất cứ linh mục nào cũng đều có nhiệm vụ ban bí tích này.",C:"Thừa tác viên thông thường là Giám mục, nhưng trong trường hợp khẩn cấp thì bất cứ linh mục nào cũng đều có nhiệm vụ ban bí tích này.",D:"Tất cả đều đúng"}, answer:"B"},
 {q:"Câu 14: Thiên Chúa muốn ta sống trong xã hội như thế nào?", options:{A:"Thiên Chúa muốn ta sống hiệp nhất, yêu thương và hài hòa với mọi người, xây dựng một nền văn minh tình thương theo mẫu mực Thiên Chúa Ba Ngôi.",B:"Thiên Chúa muốn ta sống bác ái, yêu thương và hài hòa với mọi người, xây dựng một nền văn minh tình thương theo mẫu mực Thiên Chúa Ba Ngôi.",C:"Thiên Chúa muốn ta sống hài hòa với mọi người, xây dựng một nền văn minh tình thương theo mẫu mực Thiên Chúa Ba Ngôi.",D:"Tất cả đều sai"}, answer:"C"},
 {q:"Câu 15: Người Ki-tô hữu có bổn phận nào đối với xã hội?", options:{A:"Người Ki-tô hữu cần tích cực hoán cải nội tâm và cổ võ công bằng bác ái, đồng thời góp phần đổi mới các định chế và điều kiện sống trong xã hội dưới ánh sáng Tin Mừng.",B:"Người Ki-tô hữu cần tích cực cổ võ công bằng bác ái, đồng thời góp phần đổi mới các định chế và điều kiện sống trong xã hội dưới ánh sáng Tin Mừng.",C:"Người Ki-tô hữu cần tích cực sống chứng tá bằng việc hoán cải nội tâm, cổ võ công bằng bác ái, đồng thời góp phần đổi mới các định chế và điều kiện sống trong xã hội dưới ánh sáng Tin Mừng.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 16: Ta có nhiệm vụ hoạt động tông đồ không?", options:{A:"Có. Tất cả mọi người Ki-tô hữu đều có nhiệm vụ mở rộng Nước Chúa, tham gia các hoạt động tông đồ.",B:"Có. Công việc này, trước tiên thuộc về hàng giáo sĩ và tu sĩ. Tuy nhiên, tất cả mọi người Ki-tô hữu đều có nhiệm vụ mở rộng Nước Chúa, tham gia các hoạt động tông đồ, truyền giáo.",C:"Có. Công việc này, trước tiên thuộc về hàng giáo sĩ và tu sĩ. Tuy nhiên, là người giáo dân, chúng ta cũng có nhiệm vụ mở rộng Nước Chúa, tham gia các hoạt động tông đồ, truyền giáo.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 17: Vì sao Hội Thánh có sứ mạng truyền giáo?", options:{A:"Vì Thiên Chúa muốn cho mọi người được ơn cứu độ.",B:"Vì Hội Thánh có bổn phận đem chân lý được Thiên Chúa trao phó đến cho mọi người.",C:"Vì chính Chúa Ki-tô, trước khi về trời đã sai các Tông đồ đi rao giảng Tin Mừng cho muôn dân.",D:"Cả A, B và C"}, answer:"D"},
 {q:"Câu 18: Á Bí tích là gì?", options:{A:"Á Bí tích là những dấu hiệu thánh thiêng do Hội Thánh thiết lập, để giúp các tín hữu thánh hóa một số hoàn cảnh trong cuộc sống.",B:"Á Bí tích là những dấu hiệu thánh thiêng do Chúa Giê-su thiết lập, để giúp các tín hữu thánh hóa một số hoàn cảnh trong cuộc sống.",C:"Á Bí tích là những dấu hiệu thánh thiêng do Hội Thánh thiết lập, để giúp các tín hữu thánh hóa bản thân mình, cùng một số hoàn cảnh trong cuộc sống.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 19: Vì sao chúng ta có thể tôn kính ảnh tượng?", options:{A:"Vì Con Thiên Chúa đã xuống thế, trở nên con người thật như chúng ta, nên chúng ta có thể dùng ảnh tượng để dễ hướng tâm hồn lên cùng Thiên Chúa, Đức Mẹ và các Thánh mà noi gương các Ngài.",B:"Vì Con Thiên Chúa đã làm người, nên chúng ta có thể dùng ảnh tượng để dễ hướng tâm hồn lên cùng Thiên Chúa, Đức Mẹ và các Thánh mà noi gương các Ngài.",C:"Vì Con Thiên Chúa đã xuống thế, trở nên con người thật như chúng ta, có thân xác như chúng ta, nên chúng ta có thể dùng ảnh tượng để dễ hướng tâm hồn lên cùng Thiên Chúa.",D:"Cả A, B và C"}, answer:"B"},
 {q:"Câu 20: Cầu nguyện là gì?", options:{A:"Cầu nguyện là nâng tâm hồn lên cùng Chúa, là tâm sự với Chúa nỗi lòng của mình, và để gặp gỡ và hiệp thông với Ngài.",B:"Cầu nguyện là nâng tâm hồn lên cùng Chúa, để gặp gỡ và hiệp thông với Ngài trong tình yêu thương.",C:"Cầu nguyện là nâng tâm hồn lên cùng Chúa, là tâm sự với Chúa niềm vui cũng như nỗi buồn trong cuộc sống, nhờ đó, chúng ta có thể gặp gỡ và hiệp thông với Ngài trong tình yêu thương.",D:"Cả A, B và C"}, answer:"B"},

 {section:"PHẦN II - KINH THÁNH (1 điểm)", q:"Câu 21: Em hãy hoàn tất câu Kinh Thánh sau: \"Chính anh em là muối cho đời. Chính anh em là ánh sáng cho ...\" (Mt 5,13-14)", options:{A:"Mọi nơi",B:"Trần gian",C:"Thế giới",D:"Tất cả đều đúng"}, answer:"B"},
 {q:"Câu 22: Em hãy hoàn tất câu Kinh Thánh sau: \"Anh em hãy ... và cầu nguyện, để khỏi lâm vào cơn cám dỗ. Vì tinh thần thì hăng hái, nhưng thể xác lại yếu đuối.\" (Mt 26,41)", options:{A:"Khẩn thiết",B:"Thành tâm thống hối",C:"Canh thức",D:"Tất cả đều đúng"}, answer:"C"},

 {section:"PHẦN III - KINH NGUYỆN (1 điểm)", q:"Câu 23: Em hãy hoàn tất lời kinh Năm sự Vui (2): «Thứ hai thì ngắm: Đức Bà đi viếng bà Thánh I-sa-ve. Ta hãy xin cho được ...»", options:{A:"Lòng nhân từ",B:"Ở nhân từ",C:"Lòng yêu người",D:"Tất cả đều đúng"}, answer:"C"}
];
let current = 0;
let score = 0;
let answered = false;

const qTitle = document.getElementById('q-title');
const optionsDiv = document.getElementById('options');
const sectionTitle = document.getElementById('section-title');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const scoreBadge = document.getElementById('score-badge');
const progressBar = document.getElementById('progress-bar');
const progressLabel = document.getElementById('progress-label');
const quizArea = document.getElementById('quiz-area');
const resultDiv = document.getElementById('result');

function renderQuestion(idx){
  answered = false;
  const item = quizData[idx];

  if(item.section){
    sectionTitle.textContent = item.section;
    sectionTitle.style.display = 'block';
  } else {
    sectionTitle.style.display = 'none';
  }

  qTitle.textContent = item.q;
  optionsDiv.innerHTML = '';
  feedback.style.display = 'none';
  feedback.className = '';
  nextBtn.style.display = 'none';

  Object.keys(item.options).forEach(key => {
    const label = document.createElement('label');
    label.className = 'option';
    label.id = `opt-${key}`;
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'currentQ';
    input.value = key;
    const span = document.createElement('span');
    span.textContent = `${key}. ${item.options[key]}`;
    label.appendChild(input);
    label.appendChild(span);
    label.addEventListener('click', () => selectAnswer(key));
    optionsDiv.appendChild(label);
  });

  progressBar.style.width = ((idx) / quizData.length * 100) + '%';
  progressLabel.textContent = `Câu ${idx + 1} / ${quizData.length}`;
}

function selectAnswer(key){
  if(answered) return;
  answered = true;
  const item = quizData[current];
  const correct = item.answer;
  const isCorrect = key === correct;

  if(isCorrect) score++;
  scoreBadge.textContent = `Đúng: ${score}`;

  Object.keys(item.options).forEach(k => {
    const label = document.getElementById(`opt-${k}`);
    label.classList.add('disabled');
    if(k === correct) label.classList.add('correct');
    else if(k === key) label.classList.add('incorrect');
  });

  feedback.textContent = isCorrect ? '✔ Chính xác!' : `✘ Sai rồi! Đáp án đúng là: ${correct}`;
  feedback.className = isCorrect ? 'correct-fb' : 'incorrect-fb';
  feedback.style.display = 'block';

  progressBar.style.width = ((current + 1) / quizData.length * 100) + '%';

  if(current < quizData.length - 1){
    nextBtn.style.display = 'block';
  } else {
    nextBtn.style.display = 'none';
    setTimeout(showResult, 600);
  }
}

nextBtn.addEventListener('click', () => {
  current++;
  renderQuestion(current);
});

function showResult(){
  quizArea.style.display = 'none';
  const pct = Math.round(score / quizData.length * 100);
  document.getElementById('score-text').textContent = `Điểm số: ${score} / ${quizData.length}`;
  document.getElementById('score-detail').textContent = `Tỷ lệ đúng: ${pct}%`;
  resultDiv.style.display = 'block';
  resultDiv.scrollIntoView({behavior:'smooth'});
}

document.getElementById('restart-btn').addEventListener('click', () => {
  location.reload();
});

renderQuestion(current);
</script>

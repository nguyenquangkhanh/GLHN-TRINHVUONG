<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đề Thi Giáo Lý Thêm Sức - Số I</title>
<style>
  :root{
    --navy:#0a1f44;
    --navy-light:#1b3a6b;
    --navy-accent:#274a7a;
    --gold:#c9a227;
    --green:#1f7a3d;
    --red:#b3261e;
    --bg:#eef2f8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    font-size:18px;
    background:var(--bg);
    color:var(--navy);
    margin:0;
    padding:20px;
  }
  .container{
    max-width:800px;
    margin:0 auto;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:20px 24px;
    border-radius:10px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  header .titles h1{
    margin:0 0 4px 0;
    font-size:22px;
  }
  header .titles p{
    margin:0;
    color:#cdd9ee;
    font-size:16px;
  }
  #score-badge{
    background:var(--gold);
    color:var(--navy);
    font-weight:800;
    font-size:18px;
    padding:8px 16px;
    border-radius:20px;
    white-space:nowrap;
  }
  #progress-bar-wrap{
    background:#d7e0f0;
    border-radius:20px;
    height:14px;
    margin-bottom:8px;
    overflow:hidden;
  }
  #progress-bar{
    background:var(--gold);
    height:100%;
    width:0%;
    transition:width .3s ease;
  }
  #progress-label{
    text-align:right;
    color:var(--navy-light);
    font-size:15px;
    margin-bottom:18px;
  }
  .section-title{
    color:var(--navy);
    border-left:6px solid var(--gold);
    padding-left:12px;
    margin:0 0 14px 0;
    font-size:19px;
    font-weight:700;
  }
  .card{
    background:#fff;
    border:2px solid var(--navy-accent);
    border-radius:10px;
    padding:22px 24px;
    margin-bottom:18px;
    min-height:320px;
  }
  .q-title{
    font-weight:700;
    color:var(--navy);
    margin-bottom:16px;
    font-size:19px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    border:2px solid #c7d3e8;
    border-radius:8px;
    cursor:pointer;
    background:#f6f8fc;
    transition:.15s;
  }
  .option:hover{
    border-color:var(--navy-light);
    background:#e9eef8;
  }
  .option input{
    margin-top:4px;
    transform:scale(1.2);
    accent-color:var(--navy);
  }
  .option.correct{
    background:#e3f4e8;
    border-color:var(--green);
    color:var(--green);
    font-weight:700;
  }
  .option.incorrect{
    background:#fbe6e5;
    border-color:var(--red);
    color:var(--red);
    font-weight:700;
  }
  .option.disabled{
    pointer-events:none;
  }
  #feedback{
    margin-top:16px;
    padding:12px 16px;
    border-radius:8px;
    font-weight:700;
    font-size:19px;
    display:none;
  }
  #feedback.correct-fb{
    background:#e3f4e8;
    color:var(--green);
    display:block;
  }
  #feedback.incorrect-fb{
    background:#fbe6e5;
    color:var(--red);
    display:block;
  }
  .nav-row{
    display:flex;
    justify-content:flex-end;
  }
  #next-btn{
    padding:14px 28px;
    font-size:19px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:10px;
    cursor:pointer;
    display:none;
  }
  #next-btn:hover{
    background:var(--navy-light);
  }
  #result{
    display:none;
    background:var(--navy);
    color:#fff;
    padding:28px;
    border-radius:10px;
    text-align:center;
    margin-bottom:24px;
  }
  #result h2{
    margin-top:0;
    font-size:28px;
    color:var(--gold);
  }
  #result p{
    font-size:20px;
  }
  #restart-btn{
    display:block;
    width:100%;
    padding:16px;
    font-size:20px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
  }
  #restart-btn:hover{
    background:var(--navy-light);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="titles">
      <h1>TRẮC NGHIỆM</h1>
      <p>ĐỀ THI SỐ I</p>
    </div>
    <div id="score-badge">Đúng: 0</div>
  </header>

  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="progress-label"></div>

  <div id="result">
    <h2 id="score-text"></h2>
    <p id="score-detail"></p>
    <button id="restart-btn" type="button">LÀM LẠI</button>
  </div>

  <div id="quiz-area">
    <div class="section-title" id="section-title" style="display:none;"></div>
    <div class="card">
      <div class="q-title" id="q-title"></div>
      <div class="options" id="options"></div>
      <div id="feedback"></div>
    </div>
    <div class="nav-row">
      <button id="next-btn" type="button">CÂU TIẾP THEO →</button>
    </div>
  </div>
</div>

<script>
const quizData = [
 {section:"PHẦN I - GIÁO LÝ (5 điểm)", q:"Câu 1: Sau khi tổ tông phạm tội, Thiên Chúa có bỏ loài người không?", options:{A:"Sau khi tổ tông phạm tội, Thiên Chúa không bỏ, mà còn hứa ban Đấng Cứu Thế để cứu độ loài người.",B:"Sau khi tổ tông phạm tội, Thiên Chúa đã đuổi họ ra khỏi vườn địa đàng.",C:"Sau khi tổ tông phạm tội, Thiên Chúa đã hứa ban Đấng Cứu Thế.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 2: Mầu nhiệm nhập thể là mầu nhiệm gì?", options:{A:"Là mầu nhiệm bản tính Thiên Chúa kết hợp với bản tính loài người, vì thế, Chúa Giê-su vừa là Thiên Chúa thật, vừa là người thật.",B:"Là mầu nhiệm bản tính Thiên Chúa kết hợp với bản tính loài người, trong cùng một ngôi vị duy nhất là Ngôi Hai Thiên Chúa, vì thế, Chúa Giê-su vừa là Thiên Chúa thật, vừa là người thật.",C:"Là mầu nhiệm bản tính Thiên Chúa kết hợp với bản tính loài người trong lòng Đức Mẹ Maria và được sinh ra cho chúng ta.",D:"Cả A và C"}, answer:"B"},
 {q:"Câu 3: Đời sống ẩn dật của Chúa Giê-su dạy chúng ta điều gì?", options:{A:"Dạy chúng ta sống thánh thiện trong đời sống thường ngày qua cầu nguyện, lao động và yêu thương.",B:"Dạy chúng ta sống thánh thiện trong đời sống thường ngày qua cầu nguyện, lao động và yêu thương. Đồng thời, còn dạy chúng ta sống hiếu thảo với cha mẹ.",C:"Dạy chúng ta sống thánh thiện trong đời sống thường ngày qua cầu nguyện, lao động và yêu thương. Đồng thời, còn dạy chúng ta sống hiếu thảo với cha mẹ qua việc vâng lời các ngài và trợ giúp các ngài trong khả năng của mình.",D:"Tất cả đều sai"}, answer:"B"},
 {q:"Câu 4: Mầu nhiệm Vượt qua của Chúa Giê-su có tầm quan trọng thế nào?", options:{A:"Mầu nhiệm Vượt qua của Chúa Giê-su là trung tâm của đức tin Ki-tô giáo. Mầu nhiệm này bao gồm cuộc khổ nạn, cái chết và sự phục sinh của Ngài.",B:"Mầu nhiệm Vượt qua của Chúa Giê-su là trung tâm của đức tin Ki-tô giáo. Mầu nhiệm này bao gồm cuộc khổ nạn, cái chết, sự phục sinh và tôn vinh của Ngài.",C:"Mầu nhiệm Vượt qua của Chúa Giê-su là trung tâm của đức tin Ki-tô giáo. Mầu nhiệm này bao gồm cuộc khổ nạn và cái chết của Ngài để cứu độ loài người chúng ta.",D:"Cả A, B và C"}, answer:"B"},
 {q:"Câu 5: Sự phục sinh của Chúa Giê-su mang lại cho chúng ta điều gì?", options:{A:"Mang lại cho chúng ta ơn giải thoát khỏi tội lỗi và sự chết.",B:"Mang lại cho chúng ta niềm hy vọng được sống lại trong ngày sau hết.",C:"Mang lại cho chúng ta ơn làm con Thiên Chúa và thân xác chúng ta được sống lại trong ngày sau hết.",D:"Cả A, B và C"}, answer:"C"},
 {q:"Câu 6: Chúa Thánh Thần là Đấng nào?", options:{A:"Chúa Thánh Thần là Ngôi Ba Thiên Chúa",B:"Ngài bởi Đức Chúa Cha và Đức Chúa Con mà ra",C:"Ngài được phụng thờ và tôn vinh cùng với Đức Chúa Cha và Đức Chúa Con.",D:"Cả A, B và C"}, answer:"D"},
 {q:"Câu 7: Chúa Thánh Thần hoạt động trong Hội Thánh thế nào?", options:{A:"Chúa Thánh Thần thường ở bên để củng cố Hội Thánh.",B:"Chúa Thánh Thần làm cho đời sống của Hội Thánh luôn tươi mới.",C:"Chúa Thánh Thần xây dựng, ban sức sống và thánh hóa Hội Thánh.",D:"Cả A, B và C"}, answer:"C"},
 {q:"Câu 8: Ta phải sống với Chúa Thánh Thần như thế nào?", options:{A:"Ta phải tin kính, thờ phượng Chúa Thánh Thần.",B:"Ta phải không ngừng cầu xin Chúa Thánh Thần và vâng theo ơn Người soi sáng.",C:"Ta phải tôn trọng hồn xác ta là đền thờ của Người.",D:"Cả A, B và C"}, answer:"D"},
 {q:"Câu 9: Có bao nhiêu hoa trái của Chúa Thánh Thần?", options:{A:"Theo truyền thống của Hội Thánh, có mười hoa trái của Chúa Thánh Thần là: Bác ái, vui vẻ và bình an, kiên nhẫn, hiền hòa và nhẫn nại, từ tâm, khoan dung và trung tín; khiêm nhu, tiết độ và khiết tịnh.",B:"Theo truyền thống của Hội Thánh, có mười hai hoa trái của Chúa Thánh Thần là: Bác ái, hoan lạc và bình an, kiên nhẫn, quảng đại và nhân từ, từ tâm, khoan dung và trung tín; khiêm nhu, tiết độ và khiết tịnh.",C:"Theo truyền thống của Hội Thánh, có mười hoa trái của Chúa Thánh Thần là: Bác ái, hoan lạc và bình an, kiên nhẫn, hiền hòa và nhẫn nại, từ tâm, khoan dung và trung tín; khiêm nhu, tiết độ và khiết tịnh.",D:"Cả A, B và C"}, answer:"B"},
 {q:"Câu 10: Hội Thánh là gì?", options:{A:"Hội Thánh là dân được Thiên Chúa kêu gọi và quy tụ, làm thành cộng đoàn.",B:"Hội Thánh gồm những người nhờ đức tin và Bí tích Rửa tội, trở nên con cái Thiên Chúa, chi thể của Đức Ki-tô và đền thờ của Chúa Thánh Thần.",C:"Cả A và B",D:"Tất cả đều sai"}, answer:"C"},
 {q:"Câu 11: Thiên Chúa đã ban cho Đức Maria những đặc ân nào?", options:{A:"Thiên Chúa đã ban cho Đức Maria 4 đặc ân này là: Vô nhiễm Nguyên tội, làm Mẹ Thiên Chúa, Đồng trinh trọn đời và Hồn xác lên trời.",B:"Thiên Chúa đã ban cho Đức Maria 4 đặc ân này là: Vô nhiễm Nguyên tội, làm Mẹ Thiên Chúa, làm Mẹ Giáo Hội và Hồn xác lên trời.",C:"Thiên Chúa đã ban cho Đức Mẹ 4 đặc ân này là: Vô nhiễm Nguyên tội, làm Mẹ Giáo Hội, Đồng trinh trọn đời và Hồn xác lên trời.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 12: Tội là gì?", options:{A:"Tội là lời nói, việc làm trái với Luật Chúa dạy.",B:"Tội là lời nói, việc làm xúc phạm đến Chúa, làm hại chính mình và người khác.",C:"Tội là lời nói, việc làm hoặc ước muốn trái với Luật Chúa dạy, là xúc phạm đến Chúa, làm hại chính mình và người khác.",D:"Cả A, B và C"}, answer:"C"},
 {q:"Câu 13: Chúng ta phải tham dự thánh lễ Chúa Nhật thế nào cho đúng luật Hội Thánh?", options:{A:"Chúng ta phải tham dự thánh lễ Chúa Nhật cách đầy đủ, với thái độ trang nghiêm và sốt sắng.",B:"Chúng ta phải tích cực tham dự thánh lễ từ đầu cho đến cuối. Ai cố tình bỏ lễ Chúa Nhật mà không có lý do chính đáng thì mắc tội trọng.",C:"Chúng ta phải tham dự thánh lễ Chúa Nhật cách đầy đủ, với thái độ trang nghiêm và sốt sắng. Ngoài ra, còn cần phải rước lễ khi đi tham dự thánh lễ.",D:"Cả A, B và C"}, answer:"B"},
 {q:"Câu 14: Con cái có những bổn phận nào đối với cha mẹ?", options:{A:"Con cái phải tỏ lòng hiếu thảo, biết ơn và vâng phục cha mẹ, đồng thời, phải trợ giúp các ngài về vật chất cũng như tinh thần, khi còn sống cũng như khi đã qua đời.",B:"Con cái phải tỏ lòng hiếu thảo, biết ơn và vâng phục cha mẹ, khi còn sống cũng như khi các ngài đã qua đời.",C:"Con cái phải tỏ lòng hiếu thảo, biết ơn và vâng phục cha mẹ, đồng thời, phải trợ giúp các ngài về vật chất cũng như tinh thần.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 15: Muốn giữ tâm hồn trong sạch chúng ta phải làm gì?", options:{A:"Chúng ta phải chuyên chăm cầu nguyện, lãnh nhận các Bí tích và trông cậy vào ơn Chúa.",B:"Phải sáng suốt làm chủ ngũ quan và trí tưởng tượng. Sống đoan trang trong ăn mặc, nói năng, cư xử với người khác và xa lánh dịp tội.",C:"Phải năng đọc Lời Chúa và sách báo lành mạnh.",D:"Cả A, B và C"}, answer:"D"},
 {q:"Câu 16: Vì sao chúng ta phải sống thành thật?", options:{A:"Chúng ta phải sống chân thật vì Thiên Chúa là Đấng chân thật; Ngài không chấp nhận những kẻ gian dối; và sự thành thật rất cần cho đời sống chung.",B:"Chúng ta phải sống chân thật vì Thiên Chúa là Đấng chân thật; Sự thành thật làm tăng giá trị con người và Sự thành thật rất cần cho đời sống chung.",C:"Chúng ta phải sống chân thật vì Thiên Chúa là Đấng chân thật; Ngài không chấp nhận những kẻ gian dối và sẵn sàng kết án họ.",D:"Cả A, B và C"}, answer:"B"},
 {q:"Câu 17: Bí tích Thêm Sức là gì?", options:{A:"Là Bí tích Chúa Giê-su đã lập, để ban tràn đầy Chúa Thánh Thần, hầu giúp chúng ta sống ơn Bí tích Rửa Tội cách mạnh mẽ và tốt đẹp hơn.",B:"Là Bí tích Chúa Giê-su đã lập, trước khi Ngài về trời, để ban tràn đầy Chúa Thánh Thần, hầu giúp chúng ta sống ơn Bí tích Rửa Tội cách mạnh mẽ và tốt đẹp hơn.",C:"Là Bí tích Chúa Giê-su đã lập, trước khi Ngài về trời, để ban tràn đầy Chúa Thánh Thần và những cần thiết khác, hầu giúp chúng ta sống ơn Bí tích Rửa Tội cách mạnh mẽ và tốt đẹp hơn.",D:"Cả A, B và C"}, answer:"A"},
 {q:"Câu 18: Nghi thức chính yếu của Bí tích Thêm Sức là gì?", options:{A:"Là việc xức dầu dự tòng trên trán người đã lãnh Bí tích Rửa Tội, cùng với việc đặt tay trên đầu người ấy và đọc rằng: \"Hãy lãnh nhận ấn tín ơn Chúa Thánh Thần\".",B:"Là việc xức dầu thánh trên trán người đã lãnh Bí tích Rửa Tội, cùng với lời đọc rằng: \"Hãy lãnh nhận ấn tín ơn Chúa Thánh Thần\".",C:"Là việc xức dầu thánh trên trán người đã lãnh Bí tích Rửa Tội, cùng với việc đặt tay trên đầu người ấy và đọc rằng: \"Hãy lãnh nhận ấn tín ơn Chúa Thánh Thần\".",D:"Tất cả đều đúng"}, answer:"C"},

let current = 0;
let score = 0;
let answered = false;

const qTitle = document.getElementById('q-title');
const optionsDiv = document.getElementById('options');
const sectionTitle = document.getElementById('section-title');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const scoreBadge = document.getElementById('score-badge');
const progressBar = document.getElementById('progress-bar');
const progressLabel = document.getElementById('progress-label');
const quizArea = document.getElementById('quiz-area');
const resultDiv = document.getElementById('result');

function renderQuestion(idx){
  answered = false;
  const item = quizData[idx];

  if(item.section){
    sectionTitle.textContent = item.section;
    sectionTitle.style.display = 'block';
  } else {
    sectionTitle.style.display = 'none';
  }

  qTitle.textContent = item.q;
  optionsDiv.innerHTML = '';
  feedback.style.display = 'none';
  feedback.className = '';
  nextBtn.style.display = 'none';

  Object.keys(item.options).forEach(key => {
    const label = document.createElement('label');
    label.className = 'option';
    label.id = `opt-${key}`;
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'currentQ';
    input.value = key;
    const span = document.createElement('span');
    span.textContent = `${key}. ${item.options[key]}`;
    label.appendChild(input);
    label.appendChild(span);
    label.addEventListener('click', () => selectAnswer(key));
    optionsDiv.appendChild(label);
  });

  progressBar.style.width = ((idx) / quizData.length * 100) + '%';
  progressLabel.textContent = `Câu ${idx + 1} / ${quizData.length}`;
}

function selectAnswer(key){
  if(answered) return;
  answered = true;
  const item = quizData[current];
  const correct = item.answer;
  const isCorrect = key === correct;

  if(isCorrect) score++;
  scoreBadge.textContent = `Đúng: ${score}`;

  Object.keys(item.options).forEach(k => {
    const label = document.getElementById(`opt-${k}`);
    label.classList.add('disabled');
    if(k === correct) label.classList.add('correct');
    else if(k === key) label.classList.add('incorrect');
  });

  feedback.textContent = isCorrect ? '✔ Chính xác!' : `✘ Sai rồi! Đáp án đúng là: ${correct}`;
  feedback.className = isCorrect ? 'correct-fb' : 'incorrect-fb';
  feedback.style.display = 'block';

  progressBar.style.width = ((current + 1) / quizData.length * 100) + '%';

  if(current < quizData.length - 1){
    nextBtn.style.display = 'block';
  } else {
    nextBtn.style.display = 'none';
    setTimeout(showResult, 600);
  }
}

nextBtn.addEventListener('click', () => {
  current++;
  renderQuestion(current);
});

function showResult(){
  quizArea.style.display = 'none';
  const pct = Math.round(score / quizData.length * 100);
  document.getElementById('score-text').textContent = `Điểm số: ${score} / ${quizData.length}`;
  document.getElementById('score-detail').textContent = `Tỷ lệ đúng: ${pct}%`;
  resultDiv.style.display = 'block';
  resultDiv.scrollIntoView({behavior:'smooth'});
}

document.getElementById('restart-btn').addEventListener('click', () => {
  location.reload();
});

renderQuestion(current);
</script>

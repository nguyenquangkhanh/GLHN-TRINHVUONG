<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giáo Lý Dự Tòng - Bài 1-9</title>
<style>
  :root {
    --navy-deep: #0a1a3a;
    --navy: #0f2557;
    --navy-mid: #1a3a7a;
    --navy-light: #2f4f8f;
    --gold: #c9a24b;
    --gold-light: #e8d5a3;
    --cream: #f4f1ea;
    --white: #ffffff;
    --red-wrong: #b04a4a;
    --green-right: #3c7a5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--navy-mid) 0%, var(--navy-deep) 55%, #060f24 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 640px;
  }

  .header {
    text-align: center;
    margin-bottom: 22px;
  }

  .cross {
    width: 46px;
    height: 46px;
    margin: 0 auto 10px;
    display: block;
  }

  .header h1 {
    font-size: 1.5rem;
    letter-spacing: 0.04em;
    margin: 0 0 4px;
    color: var(--gold-light);
    font-weight: 600;
  }

  .header p {
    margin: 0;
    font-size: 0.85rem;
    color: rgba(244,241,234,0.6);
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .progress-track {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    margin: 18px 0 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    border: 1px solid rgba(201,162,75,0.25);
    border-radius: 14px;
    padding: 28px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    position: relative;
  }

  .lesson-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(201,162,75,0.12);
    border: 1px solid rgba(201,162,75,0.35);
    color: var(--gold-light);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 16px;
    font-family: 'Trebuchet MS', sans-serif;
  }

  .q-counter {
    font-size: 0.8rem;
    color: rgba(244,241,234,0.5);
    margin-bottom: 6px;
    font-family: 'Trebuchet MS', sans-serif;
  }

  .prompt {
    font-size: 1.2rem;
    line-height: 1.5;
    color: var(--white);
    margin: 0 0 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    text-align: left;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--cream);
    padding: 13px 16px;
    border-radius: 10px;
    font-size: 0.98rem;
    line-height: 1.45;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: 'Georgia', serif;
    display: flex;
    gap: 10px;
  }
  .option:hover:not(:disabled) {
    background: rgba(201,162,75,0.12);
    border-color: rgba(201,162,75,0.4);
  }
  .option .letter {
    font-weight: 700;
    color: var(--gold-light);
    flex-shrink: 0;
  }
  .option:disabled { cursor: default; }

  .option.correct {
    background: rgba(60,122,92,0.25);
    border-color: var(--green-right);
  }
  .option.wrong {
    background: rgba(176,74,74,0.25);
    border-color: var(--red-wrong);
  }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.92rem;
    line-height: 1.55;
    font-family: 'Trebuchet MS', sans-serif;
    animation: fadeIn 0.3s ease;
  }
  .feedback.correct {
    background: rgba(60,122,92,0.15);
    border: 1px solid rgba(60,122,92,0.4);
    color: #bfe3cf;
  }
  .feedback.wrong {
    background: rgba(176,74,74,0.15);
    border: 1px solid rgba(176,74,74,0.4);
    color: #f0c6c6;
  }
  .feedback .verdict {
    font-weight: 700;
    display: block;
    margin-bottom: 4px;
    font-family: 'Georgia', serif;
    font-size: 1rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold), #a8823a);
    color: var(--navy-deep);
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    cursor: pointer;
    font-family: 'Trebuchet MS', sans-serif;
    display: none;
  }
  .next-btn:hover { filter: brightness(1.08); }

  .result-screen {
    text-align: center;
    display: none;
  }
  .result-screen .cross { width: 56px; height: 56px; }
  .result-score {
    font-size: 2.6rem;
    color: var(--gold-light);
    font-weight: 700;
    margin: 10px 0 6px;
  }
  .result-label {
    color: rgba(244,241,234,0.7);
    font-family: 'Trebuchet MS', sans-serif;
    margin-bottom: 22px;
  }
  .restart-btn {
    padding: 12px 28px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    border-radius: 10px;
    font-family: 'Trebuchet MS', sans-serif;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .restart-btn:hover { background: rgba(201,162,75,0.1); }

  @media (max-width: 480px) {
    .card { padding: 22px 18px; }
    .prompt { font-size: 1.05rem; }
  }
</style>
</head>

let current = 0;
let score = 0;
let answered = false;

const letters = ['A','B','C','D'];

function render() {
  const q = questions[current];
  document.getElementById('qCounter').textContent = `Câu ${current+1} / ${questions.length}`;
  document.getElementById('lessonTag').textContent = q.lesson;
  document.getElementById('prompt').textContent = q.prompt;
  document.getElementById('progressFill').style.width = `${(current/questions.length)*100}%`;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="letter">${letters[i]}.</span><span>${opt}</span>`;
    btn.onclick = () => selectAnswer(i);
    optsDiv.appendChild(btn);
  });

  document.getElementById('feedbackBox').innerHTML = '';
  document.getElementById('nextBtn').style.display = 'none';
  answered = false;
}

function selectAnswer(i) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.disabled = true);

  const isCorrect = i === q.correct;
  if (isCorrect) score++;

  opts[q.correct].classList.add('correct');
  if (!isCorrect) opts[i].classList.add('wrong');

  const fb = document.getElementById('feedbackBox');
  fb.innerHTML = `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
    <span class="verdict">${isCorrect ? 'Chính xác!' : 'Chưa đúng.'}</span>
    ${q.explain}
  </div>`;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'block';
  nextBtn.textContent = current === questions.length - 1 ? 'Xem kết quả →' : 'Câu tiếp theo →';
}

document.getElementById('nextBtn').onclick = () => {
  current++;
  if (current >= questions.length) {
    showResult();
  } else {
    render();
  }
};

function showResult() {
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('progressFill').style.width = '100%';
  const resultScreen = document.getElementById('resultScreen');
  resultScreen.style.display = 'block';
  document.getElementById('finalScore').textContent = `${score} / ${questions.length}`;
}

document.getElementById('restartBtn').onclick = () => {
  current = 0;
  score = 0;
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizCard').style.display = 'block';
  render();
};

render();
</script>
